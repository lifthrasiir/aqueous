[package]
name = "aqr-win-install"
version = "0.1.0"
edition = "2024"
description = "An installer of aqr.exe and aqr-win.exe for the user, carrying them recompressed (aqr-exe's filters and LZMA2)"
publish = false

[dependencies]
aqr-l10n.workspace = true
aqr-exe = { workspace = true, features = ["decode"] }
# XZ Utils' liblzma (0BSD), built from its source, for the payload's raw LZMA2 frames
liblzma = { workspace = true, features = ["static"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
aqr-exe = { workspace = true, default-features = true }
aqr-version.workspace = true
embed-resource.workspace = true
liblzma = { workspace = true, features = ["static"] }

[[bin]]
name = "aqr-win-install"
path = "src/main.rs"
