[package]
name = "aqr-win-install"
version = "0.1.0"
edition = "2024"
description = "An installer of aqr.exe and aqr-win.exe for the user, carrying them recompressed (aqr-exe's filters and zstd)"
publish = false

[dependencies]
aqr-l10n.workspace = true
aqr-exe = { workspace = true, features = ["decode"] }
zstd.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
aqr-exe = { workspace = true, default-features = true }
aqr-version.workspace = true
embed-resource.workspace = true
zstd.workspace = true

[[bin]]
name = "aqr-win-install"
path = "src/main.rs"
