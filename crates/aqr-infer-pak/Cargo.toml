[package]
name = "aqr-infer-pak"
version = "0.1.0"
edition = "2024"
description = "Directories of unknown archive formats (game paks) inferred: tables of records whose fields tile a target"
publish = false

[dependencies]
aqr-common.workspace = true
aqr-lz4.workspace = true
aqr-lzo.workspace = true
flate2.workspace = true
zstd.workspace = true

[dev-dependencies]
memmap2.workspace = true
# (the registry of `-Z`, for the examples)
aqr-common = { workspace = true, features = ["registry"] }

# Tools are named <crate>-<tool>, so that names do not collide in the workspace's target
# directory.

[[example]]
name = "aqr-infer-pak-probe"
path = "examples/probe.rs"

[[example]]
name = "aqr-infer-pak-batch"
path = "examples/batch.rs"
