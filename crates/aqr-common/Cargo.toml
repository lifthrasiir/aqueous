[package]
name = "aqr-common"
version = "0.1.0"
edition = "2024"
description = "Building blocks shared by the aqr-* recompressors: varints, rANS coders, bit I/O, heap accounting"
publish = false

[features]
# Serialised frequency tables for built-in models (`rans64::builtin`).
zstd = ["dep:zstd"]
# Phase marks of `mem::mark`, to stderr.
memprof = []
# The registry of the developer options of `zopt` (`zopt::apply`, `all`): for the programs
# taking `-Z`. Without it no option is registered (the modules' native libraries, the blobs).
registry = []
# rayon thread pools whose threads are workers of `pool` (`pool::rayon_pool`).
rayon = ["dep:rayon"]

[dependencies]
zstd = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

# Tasks for `pool::par_map_apart` (in the modules of aqr-modules).
[target.'cfg(target_family = "wasm")'.dependencies]
aqr-api = { workspace = true, features = ["alloc"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
crc32fast.workspace = true
# (the developer options of `zopt`, registered by the crates that read them)
inventory.workspace = true
simd-adler32.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
