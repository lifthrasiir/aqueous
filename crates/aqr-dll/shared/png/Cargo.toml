[package]
name = "aqr-dll-png"
version = "0.1.0"
edition = "2024"
description = "Made by layout.py: the crates that the same 5 modules use, as a dylib that their native libraries link against"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
aqr-dll-cfg-if = { path = "../cfg-if" }
aqr-dll-common = { path = "../common" }
aqr-dll-flate = { path = "../flate" }
aqr-dll-raw = { path = "../raw" }
aqr-dll-rt = { path = "../rt" }
aqr-png = { path = "../../../../codecs/aqr-png", default-features = false }
