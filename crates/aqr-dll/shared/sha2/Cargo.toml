[package]
name = "aqr-dll-sha2"
version = "0.1.0"
edition = "2024"
description = "Made by layout.py: the crates that the same 10 modules use, as a dylib that their native libraries link against"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
aqr-dll-cfg-if = { path = "../cfg-if" }
aqr-dll-digest = { path = "../digest" }
aqr-dll-rt = { path = "../rt" }
sha2 = { version = "=0.10.9", default-features = false }
