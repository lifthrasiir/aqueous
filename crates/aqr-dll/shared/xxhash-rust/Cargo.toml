[package]
name = "aqr-dll-xxhash-rust"
version = "0.1.0"
edition = "2024"
description = "Made by layout.py: the crates that the same 4 modules use, as a dylib that their native libraries link against"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
aqr-dll-rt = { path = "../rt" }
xxhash-rust = { version = "=0.8.19", default-features = false }
