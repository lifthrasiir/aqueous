[package]
name = "aqr-dll-wrt"
version = "0.1.0"
edition = "2024"
description = "Made by layout.py: the crates that the same 2 modules use, as a dylib that their native libraries link against"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
aqr-dll-cfg-if = { path = "../cfg-if" }
aqr-dll-common = { path = "../common" }
aqr-dll-rt = { path = "../rt" }
aqr-wrt = { path = "../../../../codecs/aqr-wrt", default-features = false }
zstd = { version = "=0.13.3", default-features = false }
zstd-safe = { version = "=7.3.0", default-features = false }
zstd-sys = { version = "=2.1.2", default-features = false }
