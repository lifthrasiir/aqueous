[package]
name = "aqr-dll-memchr"
version = "0.1.0"
edition = "2024"
description = "Made by layout.py: the crates that the same 9 modules use, as a dylib that their native libraries link against"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
aqr-dll-rt = { path = "../rt" }
memchr = { version = "=2.8.3", default-features = false }
