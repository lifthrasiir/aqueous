[package]
name = "aqr-dll-num"
version = "0.1.0"
edition = "2024"
description = "Made by layout.py: the crates that the same 3 modules use, as a dylib that their native libraries link against"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
aqr-dll-rt = { path = "../rt" }
aqr-num = { path = "../../../aqr-num", default-features = false }
zmij = { version = "=1.0.23", default-features = false }
