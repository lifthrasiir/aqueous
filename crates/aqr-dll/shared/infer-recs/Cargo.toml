[package]
name = "aqr-dll-infer-recs"
version = "0.1.0"
edition = "2024"
description = "Made by layout.py: the crates that the same 3 modules use, as a dylib that their native libraries link against"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
aqr-dll-cfg-if = { path = "../cfg-if" }
aqr-dll-common = { path = "../common" }
aqr-dll-rt = { path = "../rt" }
aqr-infer-recs = { path = "../../../../codecs/aqr-infer-recs", default-features = false }
