[package]
name = "aqr-dll-sha1"
version = "0.1.0"
edition = "2024"
description = "Made by layout.py: crates that the same modules use, as a dylib that their native libraries link against"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
aqr-dll-common = { path = "../common" }
aqr-dll-digest = { path = "../digest" }
aqr-dll-rt = { path = "../rt" }
sha1 = { version = "=0.10.7", default-features = false }
