[package]
name = "aqr-sfx-shim"
version = "0.1.0"
edition = "2024"
description = "The self-extracting stub: the small executable that a bundle of module blobs and an archive are appended to (or that `aqr-ld merge` fills with blobs); it decodes the archive and writes its files out (apply logic in aqr-sfx)"
publish = false

[[bin]]
name = "aqr-sfx-shim"
path = "src/main.rs"

[dependencies]
aqr-sfx.workspace = true
aqr-archive.workspace = true
aqr-l10n.workspace = true

[dev-dependencies]
aqr-formula.workspace = true
