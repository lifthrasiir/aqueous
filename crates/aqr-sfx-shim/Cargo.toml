[package]
name = "aqr-sfx-shim"
version = "0.1.0"
edition = "2024"
description = "The self-extracting stub: the small executable that `aqr-ld merge` fills with module blobs and an archive is appended to; it decodes the archive and writes its files out (apply logic in aqr-sfx)"
publish = false

[[bin]]
name = "aqr-sfx-shim"
path = "src/main.rs"

[dependencies]
aqr-sfx = { path = "../aqr-sfx" }
aqr-formula = { path = "../aqr-formula" }
