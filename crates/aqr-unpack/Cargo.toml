[package]
name = "aqr-unpack"
version = "0.1.0"
edition = "2024"
description = "Archives of other formats (ZIP, 7z, RAR, ALZ, EGG, tar and the compressors over it) read for extraction into a tree"
publish = false

[dependencies]
aqr-7z.workspace = true
aqr-alz.workspace = true
aqr-azo = { workspace = true, default-features = true }
aqr-bcj = { workspace = true, default-features = true }
aqr-bz2 = { workspace = true, default-features = true }
aqr-common.workspace = true
aqr-egg.workspace = true
aqr-flate = { workspace = true, default-features = true }
aqr-foreign.workspace = true
aqr-archive.workspace = true
aqr-lzma = { workspace = true, default-features = true }
aqr-rar.workspace = true
aqr-zip = { workspace = true, default-features = true }
encoding_rs.workspace = true
sha2 = { workspace = true, default-features = true }
zstd.workspace = true

[dev-dependencies]
aqr-testkit.workspace = true
