[package]
name = "aqr-dll-shim"
version = "0.1.0"
edition = "2024"
description = "Applies the modules built as native libraries (aqr-dll) to applications given or recorded from archives"
publish = false

[dependencies]
aqr-api.workspace = true
aqr-decompress.workspace = true
aqr-formula.workspace = true
aqr-archive.workspace = true
aqr-modules.workspace = true
sha2 = { workspace = true, default-features = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
aqr-blob.workspace = true
