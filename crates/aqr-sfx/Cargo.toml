[package]
name = "aqr-sfx"
version = "0.1.0"
edition = "2024"
description = "The self-extracting stub: decodes an Aqueous archive appended to it and writes its files out, running its modules through the interpreter blob merged into it (no native codecs linked)"
publish = false

[[bin]]
name = "aqr-sfx"
path = "src/main.rs"

[dependencies]
aqr-api = { path = "../aqr-api", default-features = false }
aqr-formula = { path = "../aqr-formula" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
