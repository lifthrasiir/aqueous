[package]
name = "aqr-sfx"
version = "0.1.0"
edition = "2024"
description = "The self-extracting apply logic: runs an archive's modules through the native and interpreter blobs merged into a stub, and writes its files out. The stub is aqr-sfx-shim"
publish = false

[dependencies]
aqr-common.workspace = true
aqr-api.workspace = true
aqr-blob = { workspace = true, features = ["runner"] }
aqr-formula.workspace = true
aqr-archive.workspace = true
aqr-exe = { workspace = true, features = ["decode"] }
zstd.workspace = true
# (XZ Utils' liblzma, as aqr-pack builds it: the pack aqr carries, `xz`)
liblzma = { workspace = true, features = ["static"], optional = true }
# (sfx.toml, compiled into a program's settings: aqr's alone)
toml = { workspace = true, optional = true }

[features]
# Making bundles of blobs (`bundle::pack`), the settings of sfx.toml (`config::compile`) and the
# stub's resources (`pe`), for aqr; the stub only unpacks and reads them.
encode = ["aqr-exe/encode", "dep:toml"]
# Bundles of raw LZMA2 frames (`bundle::pack_xz`, `bundle::unpack`): the pack that aqr carries,
# which its stub never reads.
xz = ["dep:liblzma"]

# The pack that aqr carries (crates/aqr-sfx/pack.py runs it): `aqr-sfx-pack DIR` writes DIR/sfx.pack.
[[bin]]
name = "aqr-sfx-pack"
required-features = ["encode", "xz"]

[dev-dependencies]
aqr-testkit.workspace = true
