[package]
name = "aqr-sfx"
version = "0.1.0"
edition = "2024"
description = "The self-extracting apply logic: runs an archive's modules through the native and interpreter blobs merged into a stub, and writes its files out. The stub is aqr-sfx-shim"
publish = false

[dependencies]
aqr-api = { path = "../aqr-api", default-features = false }
aqr-formula = { path = "../aqr-formula" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
