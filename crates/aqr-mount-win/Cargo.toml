[package]
name = "aqr-mount-win"
version = "0.1.0"
edition = "2024"
description = "aqr-mount.exe: archives mounted as drives through WinFsp where it is installed (released on its own: it links GPL-3.0 bindings)"
publish = false

[[bin]]
name = "aqr-mount"
path = "src/main.rs"

[dependencies]
aqr-ipc.workspace = true
aqr-mount.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
winfsp.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json.workspace = true
