[package]
name = "aqr"
version = "0.1.0"
edition = "2024"
description = "Command-line tools over the aqr-* recompressors and Aqueous archives"
publish = false

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-compress = { path = "../aqr-compress" }
aqr-decompress = { path = "../aqr-decompress" }
aqr-formula = { path = "../aqr-formula" }
memmap2 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[[bin]]
name = "aqr"
path = "src/main.rs"

[[bin]]
name = "aqr-show"
path = "src/bin/show.rs"
