[package]
name = "aqr"
version = "0.1.0"
edition = "2024"
description = "Command-line tools over the aqr-* recompressors and Aqueous archives"
publish = false

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-compress = { path = "../aqr-compress" }
aqr-decompress = { path = "../aqr-decompress" }
aqr-foreign = { path = "../aqr-foreign" }
aqr-formula = { path = "../aqr-formula" }
aqr-ipc = { path = "../aqr-ipc" }
aqr-l10n = { path = "../aqr-l10n" }
aqr-ld = { path = "../aqr-ld" }
aqr-modules = { path = "../aqr-modules" }
aqr-pack = { path = "../aqr-pack" }
aqr-sfx = { path = "../aqr-sfx" }
aqr-unpack = { path = "../aqr-unpack" }
memmap2 = "0.9"
serde_json = "1"
unicode-normalization = "0.1"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
encoding_rs = "0.8"

[build-dependencies]
aqr-version = { path = "../aqr-version" }
embed-resource = "3"
zstd = { version = "0.13", features = ["zstdmt"] }

[[bin]]
name = "aqr"
path = "src/main.rs"

[[bin]]
name = "aqr-show"
path = "src/bin/show.rs"
