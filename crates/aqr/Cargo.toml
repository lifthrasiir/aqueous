[package]
name = "aqr"
version = "0.1.0"
edition = "2024"
description = "Command-line tools over the aqr-* recompressors and Aqueous archives"
publish = false

[features]
# An engine linked in place of the interpreter blob (Windows x86-64; elsewhere WAH always): both
# with both, `-Z wasm:engine` picking.
wasmtime = ["aqr-decompress/wasmtime"]
wah = ["aqr-decompress/wah"]

[dependencies]
aqr-common = { workspace = true, features = ["registry"] }
aqr-compress.workspace = true
aqr-decompress.workspace = true
aqr-foreign.workspace = true
aqr-formula.workspace = true
aqr-archive.workspace = true
aqr-ipc.workspace = true
aqr-l10n.workspace = true
aqr-ld.workspace = true
aqr-modules.workspace = true
aqr-pack.workspace = true
aqr-sfx = { workspace = true, features = ["encode", "xz"] }
aqr-unpack.workspace = true
memmap2.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader"] }

[dev-dependencies]
encoding_rs.workspace = true

[build-dependencies]
aqr-version.workspace = true
embed-resource.workspace = true

[[bin]]
name = "aqr"
path = "src/main.rs"

[[bin]]
name = "aqr-show"
path = "src/bin/show.rs"
