[package]
name = "aqr-native"
version = "0.1.0"
edition = "2024"
description = "How each module of aqr-modules runs natively: its native decoding (whole, on threads) or its code as a part module, from the decoding code of the codec crates alone (shared by aqr-decompress and aqr-dll)"
publish = false

[dependencies]
aqr-api = { path = "../aqr-api", default-features = false, features = ["alloc"] }
aqr-ac3 = { path = "../../codecs/aqr-ac3", default-features = false }
