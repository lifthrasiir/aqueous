[package]
name = "aqr-pack"
version = "0.1.0"
edition = "2024"
description = "A tree written as an archive of another format (ZIP, 7z, ALZ, EGG, tar and the compressors over it), for aqr -c"
publish = false

[dependencies]
aqr-7z.workspace = true
aqr-alz.workspace = true
aqr-bz2.workspace = true
aqr-common.workspace = true
aqr-egg.workspace = true
aqr-flate.workspace = true
aqr-foreign.workspace = true
aqr-formula.workspace = true
aqr-archive.workspace = true
aqr-zip = { workspace = true, default-features = true }
encoding_rs.workspace = true
getrandom.workspace = true
# XZ Utils' liblzma (0BSD), built from its source here (not the system's), as a black box
liblzma = { workspace = true, features = ["static", "parallel"] }
zstd = { workspace = true, features = ["zstdmt"] }

[dev-dependencies]
aqr-unpack.workspace = true
memmap2.workspace = true
