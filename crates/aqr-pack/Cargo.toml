[package]
name = "aqr-pack"
version = "0.1.0"
edition = "2024"
description = "A tree written as an archive of another format (ZIP, 7z, ALZ, EGG, tar and the compressors over it), for aqr -c"
publish = false

[dependencies]
aqr-7z = { path = "../../codecs/aqr-7z" }
aqr-alz = { path = "../../codecs/aqr-alz" }
aqr-bz2 = { path = "../../codecs/aqr-bz2", default-features = false }
aqr-common = { path = "../aqr-common" }
aqr-egg = { path = "../../codecs/aqr-egg" }
aqr-flate = { path = "../../codecs/aqr-flate", default-features = false }
aqr-foreign = { path = "../aqr-foreign" }
aqr-formula = { path = "../aqr-formula" }
aqr-zip = { path = "../../codecs/aqr-zip" }
encoding_rs = "0.8"
getrandom = "0.4"
# XZ Utils' liblzma (0BSD), built from its source here (not the system's), as a black box
liblzma = { version = "0.4", default-features = false, features = ["static", "parallel"] }
zstd = { version = "0.13", features = ["zstdmt"] }

[dev-dependencies]
aqr-unpack = { path = "../aqr-unpack" }
