[package]
name = "aqr-decompress"
version = "0.1.0"
edition = "2024"
description = "Runs the modules of entry formulas natively, and decompresses Aqueous archives with them"
publish = false

[features]
default = ["wasm", "sandbox"]
# Modules that are not known run as WebAssembly, by Wasmtime.
wasm = ["aqr-wasmrt/wasm"]
# ... or so in worker processes locked down by the system (`sandbox`).
sandbox = ["wasm", "aqr-wasmrt/sandbox"]
# Wasmtime linked, rather than the modules run by the interpreter blob that the program gives
# (`set_interpreter`); always but on Windows x86-64, where the blob runs.
wasmtime = ["wasm", "aqr-wasmrt/wasmtime"]

[dependencies]
aqr-api = { workspace = true, default-features = true }
aqr-common.workspace = true
aqr-formula.workspace = true
aqr-archive.workspace = true
aqr-modules.workspace = true
aqr-native.workspace = true
aqr-wasmrt.workspace = true
sha2 = { workspace = true, default-features = true }
aqr-asar = { workspace = true, default-features = true }
aqr-b2t = { workspace = true, default-features = true }
aqr-bundle = { workspace = true, default-features = true }
aqr-exe = { workspace = true, features = ["decode"] }
aqr-flate = { workspace = true, default-features = true }
aqr-arsc = { workspace = true, default-features = true }
aqr-dex = { workspace = true, default-features = true }
aqr-dwarf = { workspace = true, default-features = true }
aqr-pdb = { workspace = true, default-features = true }
aqr-fasta = { workspace = true, default-features = true }
aqr-tensors = { workspace = true, default-features = true }
aqr-wasm = { workspace = true, default-features = true }
aqr-gnu-gettext = { workspace = true, default-features = true }
aqr-vorbis = { workspace = true, default-features = true }
aqr-ogg = { workspace = true, default-features = true }
aqr-ima = { workspace = true, default-features = true }
aqr-msadpcm = { workspace = true, default-features = true }
aqr-fits = { workspace = true, default-features = true }
aqr-hdf5 = { workspace = true, default-features = true }
aqr-git = { workspace = true, default-features = true }
aqr-minecraft = { workspace = true, default-features = true }
aqr-zstd = { workspace = true, default-features = true }
aqr-flac = { workspace = true, default-features = true }
aqr-jpeg = { workspace = true, default-features = true }
aqr-lz4 = { workspace = true, default-features = true }
aqr-bcj = { workspace = true, default-features = true }
aqr-lzma = { workspace = true, default-features = true }
aqr-lzo = { workspace = true, default-features = true }
aqr-azo = { workspace = true, default-features = true }
aqr-lha = { workspace = true, default-features = true }
aqr-rar = { workspace = true, default-features = true }
aqr-bvx = { workspace = true, default-features = true }
aqr-bz2 = { workspace = true, default-features = true }
aqr-gif = { workspace = true, default-features = true }
aqr-prores = { workspace = true, default-features = true }
aqr-lzx = { workspace = true, default-features = true }
aqr-xpress = { workspace = true, default-features = true }
aqr-lznt1 = { workspace = true, default-features = true }
aqr-mszip = { workspace = true, default-features = true }
aqr-mp3 = { workspace = true, default-features = true }
aqr-pdf = { workspace = true, default-features = true }
aqr-png = { workspace = true, default-features = true }
aqr-psd = { workspace = true, default-features = true }
aqr-clip = { workspace = true, default-features = true }
aqr-obj = { workspace = true, default-features = true }
aqr-xsv = { workspace = true, default-features = true }
aqr-jsonl = { workspace = true, default-features = true }
aqr-log = { workspace = true, default-features = true }
aqr-raw = { workspace = true, default-features = true }
aqr-infer-recs = { workspace = true, default-features = true }
aqr-ac3 = { workspace = true, default-features = true }
aqr-walk.workspace = true
aqr-div3 = { workspace = true, default-features = true }
aqr-snappy = { workspace = true, default-features = true }
aqr-zip = { workspace = true, default-features = true }
aqr-sqlite = { workspace = true, default-features = true }
aqr-tex = { workspace = true, default-features = true }
aqr-wrt = { workspace = true, default-features = true }

# (Wasmtime, where the interpreter blob does not run: but on Windows x86-64)
[target.'cfg(not(all(windows, target_arch = "x86_64")))'.dependencies]
aqr-wasmrt = { workspace = true, features = ["wasmtime"] }

[dev-dependencies]
# (the tests run modules by Wasmtime, linked)
aqr-wasmrt = { workspace = true, features = ["wasmtime", "sandbox"] }
aqr-7z.workspace = true
aqr-alz.workspace = true
aqr-egg.workspace = true
aqr-exe = { workspace = true, default-features = true }
aqr-prores = { workspace = true, default-features = true, features = ["synth"] }
aqr-testkit.workspace = true
wat.workspace = true
# (`.lzma` files for lzma-decode, as aqr-compress's `-Z lzma` makes them)
liblzma = { workspace = true, features = ["static", "parallel"] }

# Tools are named <crate>-<tool>, so that names do not collide in the workspace's target
# directory.

# A worker of the sandbox, for the tests and for hosts of no worker of their own.
[[bin]]
name = "aqr-decompress-worker"
path = "src/bin/worker.rs"
required-features = ["sandbox"]

[[example]]
name = "aqr-decompress-modules"
path = "examples/modules.rs"

[[example]]
name = "aqr-decompress-wasm"
path = "examples/wasm.rs"
required-features = ["wasm"]

[[example]]
name = "aqr-decompress-memory"
path = "examples/memory.rs"
required-features = ["wasm"]
