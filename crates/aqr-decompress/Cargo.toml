[package]
name = "aqr-decompress"
version = "0.1.0"
edition = "2024"
description = "Runs the modules of entry formulas natively, and decompresses Aqueous archives with them"
publish = false

[features]
default = ["wasm", "sandbox"]
# Modules that are not known run as WebAssembly, by Wasmtime.
wasm = ["aqr-wasmrt/wasm"]
# ... or so in worker processes locked down by the system (`sandbox`).
sandbox = ["wasm", "aqr-wasmrt/sandbox"]
# Wasmtime linked, rather than the modules run by the interpreter blob that the program gives
# (`set_interpreter`); always but on Windows x86-64, where the blob runs.
wasmtime = ["wasm", "aqr-wasmrt/wasmtime"]

[dependencies]
aqr-api = { path = "../aqr-api" }
aqr-common = { path = "../aqr-common" }
aqr-formula = { path = "../aqr-formula" }
aqr-modules = { path = "../aqr-modules" }
aqr-native = { path = "../aqr-native" }
aqr-wasmrt = { path = "../aqr-wasmrt", default-features = false }
sha2 = "0.10"
aqr-asar = { path = "../../codecs/aqr-asar" }
aqr-bundle = { path = "../../codecs/aqr-bundle" }
aqr-exe = { path = "../../codecs/aqr-exe", default-features = false, features = ["decode"] }
aqr-flate = { path = "../../codecs/aqr-flate" }
aqr-arsc = { path = "../../codecs/aqr-arsc" }
aqr-dex = { path = "../../codecs/aqr-dex" }
aqr-dwarf = { path = "../../codecs/aqr-dwarf" }
aqr-pdb = { path = "../../codecs/aqr-pdb" }
aqr-fasta = { path = "../../codecs/aqr-fasta" }
aqr-wasm = { path = "../../codecs/aqr-wasm" }
aqr-gnu-gettext = { path = "../../codecs/aqr-gnu-gettext" }
aqr-vorbis = { path = "../../codecs/aqr-vorbis" }
aqr-ogg = { path = "../../codecs/aqr-ogg" }
aqr-ima = { path = "../../codecs/aqr-ima" }
aqr-fits = { path = "../../codecs/aqr-fits" }
aqr-hdf5 = { path = "../../codecs/aqr-hdf5" }
aqr-git = { path = "../../codecs/aqr-git" }
aqr-flac = { path = "../../codecs/aqr-flac" }
aqr-jpeg = { path = "../../codecs/aqr-jpeg" }
aqr-lz4 = { path = "../../codecs/aqr-lz4" }
aqr-bcj = { path = "../../codecs/aqr-bcj" }
aqr-lzma = { path = "../../codecs/aqr-lzma" }
aqr-lzo = { path = "../../codecs/aqr-lzo" }
aqr-azo = { path = "../../codecs/aqr-azo" }
aqr-lha = { path = "../../codecs/aqr-lha" }
aqr-rar = { path = "../../codecs/aqr-rar" }
aqr-bvx = { path = "../../codecs/aqr-bvx" }
aqr-bz2 = { path = "../../codecs/aqr-bz2" }
aqr-gif = { path = "../../codecs/aqr-gif" }
aqr-prores = { path = "../../codecs/aqr-prores" }
aqr-lzx = { path = "../../codecs/aqr-lzx" }
aqr-xpress = { path = "../../codecs/aqr-xpress" }
aqr-lznt1 = { path = "../../codecs/aqr-lznt1" }
aqr-mszip = { path = "../../codecs/aqr-mszip" }
aqr-mp3 = { path = "../../codecs/aqr-mp3" }
aqr-pdf = { path = "../../codecs/aqr-pdf" }
aqr-png = { path = "../../codecs/aqr-png" }
aqr-psd = { path = "../../codecs/aqr-psd" }
aqr-clip = { path = "../../codecs/aqr-clip" }
aqr-obj = { path = "../../codecs/aqr-obj" }
aqr-xsv = { path = "../../codecs/aqr-xsv" }
aqr-jsonl = { path = "../../codecs/aqr-jsonl" }
aqr-raw = { path = "../../codecs/aqr-raw" }
aqr-infer-recs = { path = "../../codecs/aqr-infer-recs" }
aqr-ac3 = { path = "../../codecs/aqr-ac3" }
aqr-walk = { path = "../aqr-walk" }
aqr-div3 = { path = "../../codecs/aqr-div3" }
aqr-snappy = { path = "../../codecs/aqr-snappy" }
aqr-zip = { path = "../../codecs/aqr-zip" }
aqr-sqlite = { path = "../../codecs/aqr-sqlite" }
aqr-tex = { path = "../../codecs/aqr-tex" }
aqr-wrt = { path = "../../codecs/aqr-wrt" }

# (Wasmtime, where the interpreter blob does not run)
[target.'cfg(not(all(windows, target_arch = "x86_64")))'.dependencies]
aqr-wasmrt = { path = "../aqr-wasmrt", default-features = false, features = ["wasmtime"] }

[dev-dependencies]
# (the tests run modules by Wasmtime, linked)
aqr-wasmrt = { path = "../aqr-wasmrt", default-features = false, features = ["wasmtime", "sandbox"] }
aqr-7z = { path = "../../codecs/aqr-7z" }
aqr-exe = { path = "../../codecs/aqr-exe" }
aqr-prores = { path = "../../codecs/aqr-prores", features = ["synth"] }
wat = "1"

# Tools are named <crate>-<tool>, so that names do not collide in the workspace's target
# directory.

# A worker of the sandbox, for the tests and for hosts of no worker of their own.
[[bin]]
name = "aqr-decompress-worker"
path = "src/bin/worker.rs"
required-features = ["sandbox"]

[[example]]
name = "aqr-decompress-modules"
path = "examples/modules.rs"

[[example]]
name = "aqr-decompress-wasm"
path = "examples/wasm.rs"
required-features = ["wasm"]

[[example]]
name = "aqr-decompress-memory"
path = "examples/memory.rs"
required-features = ["wasm"]
