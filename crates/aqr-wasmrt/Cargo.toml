[package]
name = "aqr-wasmrt"
version = "0.1.0"
edition = "2024"
description = "Runs the Wasm modules of aqr natively (Wasmtime), in the process or in a sandbox worker; shared by aqr-decompress and the self-extracting interpreter blob"
publish = false

[features]
default = ["wasm", "sandbox", "wasmtime"]
# Modules run as WebAssembly: by Wasmtime (`wasmtime`), else by the interpreter blob the program
# gives (Windows x86-64).
wasm = ["dep:wasmparser", "dep:windows-sys", "dep:aqr-blob"]
# ... or so in worker processes locked down by the system (`sandbox`).
sandbox = ["wasm"]
# Wasmtime linked (needed but on Windows x86-64: a crate enables it there).
wasmtime = ["wasm", "dep:wasmtime"]

[dependencies]
aqr-api = { path = "../aqr-api" }
aqr-blob = { path = "../aqr-blob", features = ["runner"], optional = true }
aqr-common = { path = "../aqr-common" }
aqr-formula = { path = "../aqr-formula" }
sha2 = "0.10"
wasmparser = { version = "0.258", optional = true }
wasmtime = { version = "49", optional = true, default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation", "async"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
