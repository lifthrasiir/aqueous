[package]
name = "aqr-wasmrt"
version = "0.1.0"
edition = "2024"
description = "Runs the Wasm modules of aqr natively (Wasmtime), in the process or in a sandbox worker; shared by aqr-decompress and the self-extracting interpreter blob"
publish = false

[features]
default = ["wasm", "sandbox", "wasmtime"]
# Modules run as WebAssembly: by Wasmtime (`wasmtime`), else by the interpreter blob the program
# gives (Windows x86-64).
wasm = ["dep:wasmparser", "dep:windows-sys", "dep:aqr-blob"]
# ... or so in worker processes locked down by the system (`sandbox`).
sandbox = ["wasm"]
# The workers answer a probe of what they can do, for the tests (`Sandbox::probe`): left out of
# the programs, as connecting brings in Windows sockets (ws2_32) for that alone.
probe = ["sandbox"]
# Wasmtime linked (needed but on Windows x86-64: a crate enables it there).
wasmtime = ["wasm", "dep:wasmtime"]

[dependencies]
aqr-api = { workspace = true, default-features = true }
aqr-blob = { workspace = true, features = ["runner"], optional = true }
aqr-common.workspace = true
aqr-formula.workspace = true
aqr-archive.workspace = true
sha2 = { workspace = true, default-features = true }
wasmparser = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
