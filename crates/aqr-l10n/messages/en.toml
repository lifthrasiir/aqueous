# The frontends' messages in English, the source: every message is here, the other languages
# translate what they can (the rest falls back to these). The format is in README.md.
#
# A section is a module of aqr-l10n (`aqr_l10n::common::intact(name)`), a key its function and
# its constant (`aqr_l10n::types::ZIP`). `{name}` is a placeholder (`{{`, `}}` braces); a table
# of CLDR's plural categories is a plural, chosen by `{n}`.

# Shared by aqr-ipc, aqr-win and aqr-mac.
[common]
compressing = "Compressing…"
extracting = "Extracting…"
testing = "Testing…"
compressing_name = "Compressing {name}"
extracting_name = "Extracting {name}"
testing_name = "Testing {name}"
could_not_compress = "Could not compress"
could_not_extract = "Could not extract"
could_not_test = "Could not test"
could_not_compress_name = "Could not compress {name}"
could_not_extract_name = "Could not extract {name}"
could_not_test_name = "Could not test {name}"
not_run = "{program} is not run: {error}"
ended_with = "aqr ended with {status}."
did_not_end = "aqr did not end."
intact = "{name} is intact"
all_intact = { one = "The {n} archive is intact", other = "The {n} archives are intact" }
# A test's `end`: files, their bytes, the archive's bytes, seconds.
tested = { one = "{n} file, {bytes}, in {archive} ({seconds} s)", other = "{n} files, {bytes}, in {archive} ({seconds} s)" }
named = "{name}: {text}"
is_there_already = "{name} is there already"
same_for_others = "Do the same for the other archives"
wrong_passphrase = "Wrong passphrase, try again."
passphrases_differ = "The two passphrases differ, try again."
ok = "OK"
cancel = "Cancel"

# The names of the file types, as Explorer (aqr-win's FORMATS) and Finder (Info.plist's
# UTTypeDescription and CFBundleTypeName, by InfoPlist.strings) show them. In Windows' string table.
[types]
aqr = "Aqueous archive"
zip = "ZIP archive"
seven_z = "7z archive"
rar = "RAR archive"
alz = "ALZip archive"
egg = "EGG archive"
tar = "tar archive"
tgz = "tar archive (gzip)"
tbz2 = "tar archive (bzip2)"
txz = "tar archive (xz)"
gz = "gzip file"
bz2 = "bzip2 file"
xz = "xz file"
lzma = "LZMA file"
zst = "Zstandard file"

# Explorer's verbs and Settings' default apps (aqr-win's register.rs), read by Explorer from
# Windows' string table: no placeholders.
