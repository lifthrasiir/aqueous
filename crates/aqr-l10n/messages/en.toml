compress = "Compress with Aqueous"
compress_passphrase = "Compress with passphrase…"
compress_zip = "Compress into .zip"
compress_7z = "Compress into .7z"
extract = "Extract here"
test = "Test"
description = "Archives recompressed losslessly; other formats extracted"

