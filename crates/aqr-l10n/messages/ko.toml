# The frontends' messages in Korean (en.toml is the source; README.md has the format).
#
# 조사: a placeholder is followed by no particle that depends on its last sound (이/가, 을/를,
# 은/는, 와/과, (으)로), as what fills it is not known: 에, 의, 도 or a word after it instead.
# "passphrase" is 암호 throughout, as Windows and macOS have it.

