tip_close_segment = "-S: 압축 파일이 대략 이만큼 커지면 세그먼트를 닫습니다. 중간에 멈춰도 끝난 세그먼트는 남습니다."
tip_dictionaries = "-D: 비슷한 블록끼리 그 블록들에 맞춰 훈련한 사전으로 압축합니다. 작은 파일이 많을 때 도움이 됩니다."
tip_passphrase = "-P: 압축을 시작할 때 암호를 묻습니다."
tip_archival = "-A: 손상되면 파일 하나보다 많이 잃게 되는 블록을 이중으로 저장합니다."
tip_verify = "--no-check: 만든 압축 파일을 다시 풀어 원본과 비교합니다. 끄면 시간이 줄어듭니다."
tip_keep_nothing = "--atomic: 중단되면 모두 지웁니다. 끄면 중단된 압축 파일이 진행된 데까지 남습니다."
tip_if_exists = "-f, -a, -s: 추가는 새 파일과 바뀐 파일만 더하고, 맞추기는 입력에 없는 파일도 지웁니다."
tip_version_name = "-j: 압축 파일이 남는 상태에 이름을 붙여 나중에 돌아갈 수 있게 합니다. {{today}}와 {{now}}를 쓸 수 있습니다."
tip_delete_originals = "--rm: 압축이 끝나면 압축한 원본을 지웁니다. 그사이 바뀐 파일은 남깁니다."
tip_threads = "-T: 작업 스레드의 수입니다."
tip_memory = "-M: 한 번에 쓰는 힙의 대략적인 최댓값입니다. 너무 낮으면 느려질 수 있습니다."
tip_module_memory = "--application-bound: 이보다 메모리가 더 필요한 재압축은 쓰지 않습니다. 올리면 더 작은 기기에서 열 수 없는 압축 파일이 만들어질 수 있습니다."
