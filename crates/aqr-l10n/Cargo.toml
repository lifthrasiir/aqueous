edition = "2024"
description = "The frontends' messages (aqr-win, aqr-win-install, aqr-mac) in the languages of messages/*.toml, and Windows' and macOS' resources made of them"
publish = false

[build-dependencies]
toml = "1"

[[bin]]
name = "aqr-l10n"
path = "src/main.rs"
