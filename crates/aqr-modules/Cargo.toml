[package]
name = "aqr-modules"
version = "0.1.0"
edition = "2024"
description = "The modules of aqr-decompress as Wasm modules: built from the recompressors' code (build.py), and known by their hashes"
publish = false

[features]
# The modules (src/bin), built for wasm32-unknown-unknown by build.py.
wasm = []

# Natively, the library is only the modules built; the recompressors are for the Wasm modules.
[target.'cfg(target_family = "wasm")'.dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-asar.workspace = true
aqr-b2t.workspace = true
aqr-bundle.workspace = true
aqr-bvx.workspace = true
aqr-bz2.workspace = true
aqr-clip.workspace = true
aqr-exe = { workspace = true, features = ["decode"] }
aqr-arsc.workspace = true
aqr-dex.workspace = true
aqr-dwarf.workspace = true
aqr-pdb.workspace = true
aqr-fasta.workspace = true
aqr-tensors.workspace = true
aqr-gif.workspace = true
aqr-prores.workspace = true
aqr-gnu-gettext.workspace = true
aqr-vorbis.workspace = true
aqr-ogg.workspace = true
aqr-ima.workspace = true
aqr-msadpcm.workspace = true
aqr-fits.workspace = true
aqr-hdf5.workspace = true
aqr-flac.workspace = true
aqr-flate.workspace = true
aqr-git.workspace = true
aqr-minecraft.workspace = true
aqr-zstd.workspace = true
aqr-infer-recs.workspace = true
aqr-jpeg.workspace = true
aqr-lz4.workspace = true
aqr-bcj.workspace = true
aqr-lzma.workspace = true
aqr-lzo.workspace = true
aqr-azo.workspace = true
aqr-lha.workspace = true
aqr-rar.workspace = true
aqr-lzx.workspace = true
aqr-xpress.workspace = true
aqr-lznt1.workspace = true
aqr-mp3.workspace = true
aqr-ac3.workspace = true
aqr-div3.workspace = true
aqr-mszip.workspace = true
aqr-obj.workspace = true
aqr-pdf.workspace = true
aqr-png.workspace = true
aqr-psd.workspace = true
aqr-raw.workspace = true
aqr-snappy.workspace = true
aqr-sqlite.workspace = true
aqr-tex.workspace = true
aqr-wrt.workspace = true
aqr-wasm.workspace = true
aqr-xsv.workspace = true
aqr-jsonl.workspace = true
aqr-log.workspace = true
aqr-zip.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
sha2 = { workspace = true, default-features = true }

# A binary per module, named after it ('/' as '-').

[[bin]]
name = "lz4-recons"
path = "src/bin/lz4-recons.rs"
required-features = ["wasm"]

