[package]
name = "aqr-modules"
version = "0.1.0"
edition = "2024"
description = "The modules of aqr-decompress as Wasm modules: built from the recompressors' code (build.sh), and known by their hashes"
publish = false

[features]
# The modules (src/bin), built for wasm32-unknown-unknown by build.sh.
wasm = []

# Natively, the library is only the modules built; the recompressors are for the Wasm modules.
[target.'cfg(target_family = "wasm")'.dependencies]
aqr-api = { path = "../aqr-api", default-features = false, features = ["alloc"] }
aqr-bundle = { path = "../../codecs/aqr-bundle", default-features = false }
aqr-clip = { path = "../../codecs/aqr-clip", default-features = false }
aqr-exe = { path = "../../codecs/aqr-exe", default-features = false, features = ["decode"] }
aqr-fasta = { path = "../../codecs/aqr-fasta", default-features = false }
aqr-gnu-gettext = { path = "../../codecs/aqr-gnu-gettext", default-features = false }
aqr-fits = { path = "../../codecs/aqr-fits", default-features = false }
aqr-flac = { path = "../../codecs/aqr-flac", default-features = false }
aqr-flate = { path = "../../codecs/aqr-flate", default-features = false }
aqr-git = { path = "../../codecs/aqr-git", default-features = false }
aqr-infer-recs = { path = "../../codecs/aqr-infer-recs", default-features = false }
aqr-jpeg = { path = "../../codecs/aqr-jpeg", default-features = false }
aqr-lz4 = { path = "../../codecs/aqr-lz4", default-features = false }
aqr-lzma = { path = "../../codecs/aqr-lzma", default-features = false }
aqr-lzo = { path = "../../codecs/aqr-lzo", default-features = false }
aqr-mp3 = { path = "../../codecs/aqr-mp3", default-features = false }
aqr-obj = { path = "../../codecs/aqr-obj", default-features = false }
aqr-pdf = { path = "../../codecs/aqr-pdf", default-features = false }
aqr-png = { path = "../../codecs/aqr-png", default-features = false }
aqr-psd = { path = "../../codecs/aqr-psd", default-features = false }
aqr-raw = { path = "../../codecs/aqr-raw", default-features = false }
aqr-snappy = { path = "../../codecs/aqr-snappy", default-features = false }
aqr-sqlite = { path = "../../codecs/aqr-sqlite", default-features = false }
aqr-tex = { path = "../../codecs/aqr-tex", default-features = false }
aqr-wrt = { path = "../../codecs/aqr-wrt", default-features = false }
aqr-xsv = { path = "../../codecs/aqr-xsv", default-features = false }
aqr-zip = { path = "../../codecs/aqr-zip", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
sha2 = "0.10"

# A binary per module, named after it ('/' as '-').

[[bin]]
name = "lz4-recons"
path = "src/bin/lz4-recons.rs"
required-features = ["wasm"]

