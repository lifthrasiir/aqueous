[package]
name = "aqr-archive"
version = "0.1.0"
edition = "2024"
description = "Aqueous archives: the encoder and decoder of entry formulas as archives, their metadata, segments and envelopes, and the evaluation of formulas"
publish = false

[dependencies]
crc-fast.workspace = true
aqr-common.workspace = true
aqr-formula.workspace = true
chacha20.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
scrypt.workspace = true
sha2 = { workspace = true, default-features = true }
xxhash-rust = { workspace = true, features = ["xxh3", "xxh64"] }
zstd = { workspace = true, features = ["zstdmt", "experimental", "zdict_builder"] }

[dev-dependencies]
aqr-testkit.workspace = true
