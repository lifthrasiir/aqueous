[package]
name = "aqr-mac"
version = "0.1.0"
edition = "2024"
description = "Aqueous in Finder: Quick Actions and .aqr files, their progress on the files in Finder, over aqr --ipc"
publish = false

[dependencies]
aqr-ipc = { path = "../aqr-ipc" }
aqr-l10n = { path = "../aqr-l10n" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSBundle",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSIndexSet",
    "NSNotification",
    "NSObject",
    "NSProgress",
    "NSString",
    "NSThread",
    "NSTimer",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSActionCell",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSSecureTextField",
    "NSRunningApplication",
    "NSScrollView",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableView",
    "NSText",
    "NSTextField",
    "NSTextFieldCell",
    "NSTextView",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
] }

[[bin]]
name = "aqr-mac"
path = "src/main.rs"
