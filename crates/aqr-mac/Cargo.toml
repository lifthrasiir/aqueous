[package]
name = "aqr-mac"
version = "0.1.0"
edition = "2024"
description = "Aqueous in Finder: Quick Actions and .aqr files, their progress on the files in Finder, over aqr --ipc"
publish = false

[dependencies]
aqr-ipc.workspace = true
aqr-l10n.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true

[[bin]]
name = "aqr-mac"
path = "src/main.rs"
