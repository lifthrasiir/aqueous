[package]
name = "aqr-win"
version = "0.1.0"
edition = "2024"
description = "Explorer's verbs for Aqueous archives and a window of how far they are, over aqr --ipc"
publish = false

[dependencies]
aqr-ipc.workspace = true
aqr-l10n.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Registry", "Win32_System_Threading"] }

[build-dependencies]
aqr-l10n.workspace = true
aqr-version.workspace = true
embed-resource.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "aqr-win"
path = "src/main.rs"
