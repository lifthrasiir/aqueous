[package]
name = "aqr-foreign"
version = "0.1.0"
edition = "2024"
description = "What archives of other formats keep alike, both ways: their encryptions (ZIP's, WinZip's AES, 7-Zip's AES) times (FILETIME, MS-DOS's) and the character sets of names"
publish = false

[dependencies]
aes.workspace = true
aqr-archive.workspace = true
cbc.workspace = true
ctr.workspace = true
encoding_rs.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
sha1 = { workspace = true, default-features = true }
sha2 = { workspace = true, default-features = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Time"] }
