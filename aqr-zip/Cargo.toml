[package]
name = "aqr-zip"
version = "0.1.0"
edition = "2024"
description = "ZIP archives rebuilt bit for bit from the contents of their entries, by aqr-flate, with their headers derived"
publish = false

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-formula = { path = "../aqr-formula" }
aqr-flate = { path = "../aqr-flate" }
crc32fast = "1.5"
memchr = "2"

[dev-dependencies]
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zstd = "0.13"

[[example]]
name = "check-zip"
path = "examples/check.rs"
