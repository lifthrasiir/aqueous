[package]
name = "aqr-git"
version = "0.1.0"
edition = "2024"
description = "Lossless recompression of git checkouts: the working tree and .git rebuilt bit for bit from interconnected streams"
publish = false

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-flate = { path = "../aqr-flate" }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
sha1 = "0.10"
crc32fast = "1.5"
zstd = { version = "0.13", features = ["zstdmt"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
flate-zoo = { path = "../flate-zoo" }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-git-calib"
path = "examples/calib.rs"

[[example]]
name = "aqr-git-dump"
path = "examples/dump.rs"

[[example]]
name = "aqr-git-emucost"
path = "examples/emucost.rs"

[[example]]
name = "aqr-git-prof"
path = "examples/prof.rs"
