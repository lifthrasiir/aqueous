[package]
name = "aqr-modules"
version = "0.1.0"
edition = "2024"
description = "The modules of aqr-decompress as Wasm modules: built from the recompressors' code (build.sh), and known by their hashes"
publish = false

[features]
# The modules (src/bin), built for wasm32-unknown-unknown by build.sh.
wasm = []

# Natively, the library is only the modules built; the recompressors are for the Wasm modules.
[target.'cfg(target_family = "wasm")'.dependencies]
aqr-api = { path = "../aqr-api", default-features = false, features = ["alloc"] }
aqr-bundle = { path = "../aqr-bundle", default-features = false }
aqr-exe = { path = "../aqr-exe", default-features = false, features = ["decode"] }
aqr-fasta = { path = "../aqr-fasta", default-features = false }
aqr-flac = { path = "../aqr-flac", default-features = false }
aqr-flate = { path = "../aqr-flate", default-features = false }
aqr-jpeg = { path = "../aqr-jpeg", default-features = false }
aqr-lz4 = { path = "../aqr-lz4", default-features = false }
aqr-lzma = { path = "../aqr-lzma", default-features = false }
aqr-lzo = { path = "../aqr-lzo", default-features = false }
aqr-mp3 = { path = "../aqr-mp3", default-features = false }
aqr-pdf = { path = "../aqr-pdf", default-features = false }
aqr-png = { path = "../aqr-png", default-features = false }
aqr-psd = { path = "../aqr-psd", default-features = false }
aqr-raw = { path = "../aqr-raw", default-features = false }
aqr-snappy = { path = "../aqr-snappy", default-features = false }
aqr-sqlite = { path = "../aqr-sqlite", default-features = false }
aqr-tex = { path = "../aqr-tex", default-features = false }
aqr-wrt = { path = "../aqr-wrt", default-features = false }
aqr-zip = { path = "../aqr-zip", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
sha2 = "0.10"

# A binary per module, named after it ('/' as '-').

[[bin]]
name = "lz4-recons"
path = "src/bin/lz4-recons.rs"
required-features = ["wasm"]

[[bin]]
name = "lzma-recons"
path = "src/bin/lzma-recons.rs"
required-features = ["wasm"]

