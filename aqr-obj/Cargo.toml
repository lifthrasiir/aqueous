[package]
name = "aqr-obj"
version = "0.1.0"
edition = "2024"
description = "Lossless Wavefront OBJ recompression: bit-exact reconstruction from a smaller representation"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`) and the tool; without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-formula = { path = "../aqr-formula", optional = true }
aqr-num = { path = "../aqr-num" }
memchr = "2"

[dev-dependencies]
aqr-formula = { path = "../aqr-formula" }
zstd = "0.13"

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[bin]]
name = "aqr-obj"
path = "src/main.rs"
required-features = ["encode"]

[[example]]
name = "aqr-obj-dups"
path = "examples/dups.rs"

[[example]]
name = "aqr-obj-entropy"
path = "examples/entropy.rs"

[[example]]
name = "aqr-obj-fpred"
path = "examples/fpred.rs"

[[example]]
name = "aqr-obj-fpred2"
path = "examples/fpred2.rs"

[[example]]
name = "aqr-obj-fsym-hist"
path = "examples/fsym_hist.rs"

[[example]]
name = "aqr-obj-repro"
path = "examples/repro.rs"

[[example]]
name = "aqr-obj-vpred"
path = "examples/vpred.rs"

[[example]]
name = "aqr-obj-vpred2"
path = "examples/vpred2.rs"

[[example]]
name = "aqr-obj-vpred-hist"
path = "examples/vpred_hist.rs"
