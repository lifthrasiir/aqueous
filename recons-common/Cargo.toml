[package]
name = "recons-common"
version = "0.1.0"
edition = "2024"
description = "Building blocks shared by the *-recons recompressors: varints, rANS coders, bit I/O, heap accounting"
publish = false

[features]
# Serialised frequency tables for built-in models (`rans64::builtin`).
zstd = ["dep:zstd"]
# Phase marks of `mem::mark`, to stderr.
memprof = []

[dependencies]
zstd = { version = "0.13", optional = true }
