[package]
name = "mp3-recons"
version = "0.1.0"
edition = "2024"

[dependencies]
recons-common = { path = "../recons-common", features = ["zstd"] }
recons-formula = { path = "../recons-formula" }
memchr = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[profile.release]
debug = true
lto = true
codegen-units = 1
panic = "unwind"

[[bin]]
name = "mp3r"
path = "src/main.rs"
