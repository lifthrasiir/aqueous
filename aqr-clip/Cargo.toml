[package]
name = "aqr-clip"
version = "0.1.0"
edition = "2024"
description = "Clip Studio Paint files (.clip): the container and its tiles, and models for them (research stage)"
publish = false

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-flate = { path = "../aqr-flate", default-features = false }
aqr-formula = { path = "../aqr-formula" }
aqr-psd = { path = "../aqr-psd" }
aqr-raw = { path = "../aqr-raw" }
aqr-sqlite = { path = "../aqr-sqlite" }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
