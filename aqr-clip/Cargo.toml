[package]
name = "aqr-clip"
version = "0.1.0"
edition = "2024"
description = "Clip Studio Paint files (.clip): tiles coded by a model of whole pixels, their zlib streams made again, the database by aqr-sqlite"
publish = false

[features]
default = ["encode"]
# The formula (`formula`), the static-table model and the research tool; without it, the code
# of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:aqr-sqlite", "dep:aqr-psd", "dep:aqr-raw", "dep:flate2"]

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-flate = { path = "../aqr-flate", default-features = false }
aqr-formula = { path = "../aqr-formula", optional = true }
aqr-psd = { path = "../aqr-psd", optional = true }
aqr-raw = { path = "../aqr-raw", optional = true }
aqr-sqlite = { path = "../aqr-sqlite", optional = true }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"], optional = true }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[bin]]
name = "aqr-clip"
path = "src/main.rs"
required-features = ["encode"]
