[package]
name = "aqr-raw"
version = "0.1.0"
edition = "2024"
description = "Uncompressed sampled data, PCM audio and raster images: their models as a library, and as modules of entry formulas with the trivial containers (WAV, AIFF, BMP, PNM) taken apart"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`) and the built-in tables; without it, the code of the modules alone
# (`module`).
encode = ["dep:aqr-formula", "aqr-common/zstd"]

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-formula = { path = "../aqr-formula", optional = true }

# Tasks and channels for the pipelines (`audio::par::apart`) in the modules of aqr-modules.
[target.'cfg(target_family = "wasm")'.dependencies]
aqr-api = { path = "../aqr-api", default-features = false, features = ["alloc"] }
