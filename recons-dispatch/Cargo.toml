[package]
name = "recons-dispatch"
version = "0.1.0"
edition = "2024"
description = "Picks the recompressor for a file by its magic bytes, and gives the result as an entry formula"
publish = false

[dependencies]
recons-formula = { path = "../recons-formula" }
exe-recons = { path = "../exe-recons" }
flate-recons = { path = "../flate-recons" }
flac-recons = { path = "../flac-recons" }
jpeg-recons = { path = "../jpeg-recons" }
mp3-recons = { path = "../mp3-recons" }
pdf-recons = { path = "../pdf-recons" }
png-recons = { path = "../png-recons" }
psd-recons = { path = "../psd-recons" }
sqlite-recons = { path = "../sqlite-recons" }

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[profile.release]
debug = 1
