[package]
name = "aqr-compress"
version = "0.1.0"
edition = "2024"
description = "Picks the recompressor for a file by its magic bytes, gives the result as an entry formula, and stores it as an Aqueous archive"
publish = false

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-formula = { path = "../aqr-formula" }
aqr-decompress = { path = "../aqr-decompress" }
aqr-bundle = { path = "../aqr-bundle" }
aqr-exe = { path = "../aqr-exe", default-features = false, features = ["encode"] }
aqr-flate = { path = "../aqr-flate" }
aqr-fasta = { path = "../aqr-fasta" }
aqr-fits = { path = "../aqr-fits" }
aqr-git = { path = "../aqr-git" }
aqr-flac = { path = "../aqr-flac" }
aqr-jpeg = { path = "../aqr-jpeg" }
aqr-lz4 = { path = "../aqr-lz4" }
aqr-lzma = { path = "../aqr-lzma" }
aqr-lzo = { path = "../aqr-lzo" }
aqr-mp3 = { path = "../aqr-mp3" }
aqr-pdf = { path = "../aqr-pdf" }
aqr-png = { path = "../aqr-png" }
aqr-obj = { path = "../aqr-obj" }
aqr-psd = { path = "../aqr-psd" }
aqr-clip = { path = "../aqr-clip" }
aqr-raw = { path = "../aqr-raw" }
aqr-snappy = { path = "../aqr-snappy" }
aqr-sqlite = { path = "../aqr-sqlite" }
aqr-tex = { path = "../aqr-tex" }
aqr-wrt = { path = "../aqr-wrt" }
aqr-zip = { path = "../aqr-zip" }
crc32fast = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
zstd = "0.13"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-compress-memprobe"
path = "examples/memprobe.rs"

[[example]]
name = "aqr-compress-classprobe"
path = "examples/classprobe.rs"
