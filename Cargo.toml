[workspace]
resolver = "3"
members = [
    "aqr",
    "aqr-common",
    "aqr-bundle",
    "aqr-clip",
    "aqr-formula",
    "aqr-num",
    "aqr-compress",
    "aqr-decompress",
    "aqr-exe",
    "aqr-fasta",
    "aqr-fits",
    "aqr-flac",
    "aqr-flate",
    "aqr-git",
    "aqr-jpeg",
    "aqr-lz4",
    "aqr-lzma",
    "aqr-lzo",
    "aqr-mp3",
    "aqr-obj",
    "aqr-pdf",
    "aqr-png",
    "aqr-psd",
    "aqr-raw",
    "aqr-snappy",
    "aqr-sqlite",
    "aqr-tex",
    "aqr-wrt",
    "aqr-zip",
    "aqr-api",
    "aqr-api/demo/concat",
    "aqr-api/demo/xor",
    "aqr-api/demo/split",
    "aqr-ld",
    "aqr-modules",
]
# flate-zoo is a submodule with a workspace of its own; the benches are standalone, with the
# checkouts of third_party/ (some of them workspaces of their own).
exclude = ["flate-zoo", "third_party", "aqr-flate/bench", "aqr-png/bench"]

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

[profile.release.package.aqr-flac]
debug = true

[profile.release.package.aqr-jpeg]
debug = true

[profile.release.package.aqr-mp3]
debug = true

[profile.release.package.aqr-raw]
debug = true

# For the tests (`cargo rt`, an alias of `cargo test --profile release-test`): optimised, as the
# tests are slow otherwise, but without the fat LTO and the single codegen unit with which every
# test binary linking wasmtime took minutes. The timings (`--ignored` tests) still want `-r`.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"

# Its generated lowering does not split into codegen units: 80 s on the critical path at
# opt-level 1 or 3, 20 s at 0; the tests compile little Wasm with it (+2 s of 65 s).
[profile.release-test.package.cranelift-codegen]
opt-level = 0

# aqr-exe as a Wasm module (aqr-exe/build-wasm.bat).
[profile.release-wasm]
inherits = "release"
debug = false
strip = true
