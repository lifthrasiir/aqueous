[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/aqr-api/demo/concat",
    "crates/aqr-api/demo/xor",
    "crates/aqr-api/demo/split",
    "crates/aqr-ld/demo/stub",
    "crates/aqr-ld/demo/modadd",
    "crates/aqr-ld/demo/modxor",
    "crates/aqr-ld/demo/modpanic",
    "codecs/*",
]
# The benches are standalone, with the checkouts of third_party/ (some of them workspaces of their
# own).
exclude = ["third_party", "codecs/aqr-flate/bench", "codecs/aqr-png/bench"]

[workspace.dependencies]
# DEFLATE encoders for aqr-flate's training and the tests of aqr-flate, aqr-png and aqr-pdf. The
# backends here work with MSVC as well; the crates add the others for
# `cfg(not(target_env = "msvc"))`: zlib-ng, zlib-chromium, libslz, cryptopp, go, gzip, infozip and
# ect do not build, and zlib-cloudflare builds but takes zlib's symbols (or zlib its), the other
# one then refusing every stream.
flate-zoo = { version = "1.0.0", default-features = false, features = [
    "zlib", "libdeflate", "zopfli", "miniz", "stb", "lodepng", "sdefl", "uzlib",
    "7zip", "advancecomp-7z", "apple", "rust", "js", "isa-l",
] }

# Thin-local LTO and 16 codegen units (Cargo's defaults) rather than fat LTO and one unit: on an
# M4 the build of `aqr` from scratch 148 -> 73 s, after touching aqr-flate 113 -> 20 s, after
# touching aqr 98 -> 1.5 s; 10gb compressed +0.7% instructions retired, tested +0.3%, the same
# wall-clock within noise (thin LTO: +0.4% and +0.3%, but 31 s after touching aqr).
[profile.release]
debug = 1

[profile.release.package.aqr-flac]
debug = true

[profile.release.package.aqr-jpeg]
debug = true

[profile.release.package.aqr-mp3]
debug = true

[profile.release.package.aqr-raw]
debug = true

# For the tests (`cargo rt`, an alias of `cargo test --profile release-test`): optimised, as the
# tests are slow otherwise, and incremental. The timings (`--ignored` tests) still want `-r`.
[profile.release-test]
inherits = "release"
incremental = true
debug = "line-tables-only"

# Its generated lowering does not split into codegen units: 80 s on the critical path at
# opt-level 1 or 3, 20 s at 0; the tests compile little Wasm with it (+2 s of 65 s).
[profile.release-test.package.cranelift-codegen]
opt-level = 0

# Binaries for distribution (`cargo win7`, `cargo build --profile dist -p aqr`): fat LTO and one
# codegen unit for the last 0.3-0.7% of instructions (profile.release has the numbers).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
# `debug = 1` from release turns off Cargo's default `strip = "debuginfo"`, leaving the DWARF in
# the ELF (Linux) and the debug map in Mach-O (macOS). Symbols stay for backtraces' names.
# MSVC is unaffected: its debug info is in the .pdb.
strip = "debuginfo"

# The crates of dist's binaries that no codec's work runs through (the command line, other
# archive formats, disk images and packs, the frontends' parts, the SFX's making), optimised
# for size: aqr.exe 31.44 -> 28.77 MB (.text 19.6 -> 17.1 MB), no slower compressing ZIPs, PSDs
# and 10gb/2011 or testing them (opt-level "s" for every crate: 24.90 MB, 15-24% slower).
# `aqr` takes the generic code it instantiates (core's, alloc's, hashbrown's) along.
[profile.dist.package]
aqr.opt-level = "s"
aqr-unpack.opt-level = "s"
aqr-pack.opt-level = "s"
aqr-foreign.opt-level = "s"
aqr-ipc.opt-level = "s"
aqr-l10n.opt-level = "s"
aqr-sfx.opt-level = "s"
aqr-blob.opt-level = "s"
aqr-bundle.opt-level = "s"
aqr-disk.opt-level = "s"
aqr-iso.opt-level = "s"
aqr-fat.opt-level = "s"
aqr-ntfs.opt-level = "s"
aqr-ext.opt-level = "s"
aqr-apfs.opt-level = "s"
aqr-hfs.opt-level = "s"
encoding_rs.opt-level = "s"
unicode-normalization.opt-level = "s"
wasmparser.opt-level = "s"

# The Wasm modules (crates/aqr-modules/build.py): fat LTO and one codegen unit as in dist (not
# inheriting it, so as not to take its crates optimised for size), for small modules and for
# their bytes (hence hashes) to stay as they were.
[profile.release-wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true
