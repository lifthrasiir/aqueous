[package]
name = "png-recons"
version = "0.1.0"
edition = "2024"
description = "Lossless PNG recompression: bit-exact reconstruction from a smaller representation"
publish = false

[dependencies]
flate-recons = { path = "../flate-recons" }
crc32fast = "1.5"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
debug = 1
