[package]
name = "flate-recons"
version = "0.1.0"
edition = "2024"
description = "DEFLATE stream deconstruction into predictable decisions and bit-exact reconstruction"
publish = false

[features]
# The training tool, which drives real encoders through flate-zoo.
train = ["dep:flate-zoo", "dep:rayon", "demo"]
# The recompression demos (`compress`/`decompress`), which store the data with zstd.
demo = ["dep:zstd"]

[dependencies]
flate-zoo = { path = "../flate-zoo", optional = true }
rayon = { version = "1.12.0", optional = true }
zstd = { version = "0.13.3", optional = true }

[dev-dependencies]
flate-zoo = { path = "../flate-zoo" }

[[bin]]
name = "flate-recons"
path = "src/bin/recons.rs"
required-features = ["demo"]

[[bin]]
name = "flate-recons-train"
path = "src/bin/train.rs"
required-features = ["train"]

[[bin]]
name = "flate-recons-fast"
path = "src/bin/fast.rs"
required-features = ["train"]

[profile.release]
debug = 1
