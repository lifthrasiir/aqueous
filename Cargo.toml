[package]
name = "flate-recons"
version = "0.1.0"
edition = "2024"
description = "DEFLATE stream deconstruction into predictable decisions and bit-exact reconstruction"
publish = false

[features]
# The training tool, which drives real encoders through flate-zoo.
train = ["dep:flate-zoo", "dep:rayon"]

[dependencies]
flate-zoo = { path = "../flate-zoo", optional = true }
rayon = { version = "1.12.0", optional = true }

[dev-dependencies]
flate-zoo = { path = "../flate-zoo" }

[[bin]]
name = "flate-recons-train"
path = "src/bin/train.rs"
required-features = ["train"]

[profile.release]
debug = 1
