[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/aqr-api/demo/concat",
    "crates/aqr-api/demo/xor",
    "crates/aqr-api/demo/split",
    "crates/aqr-ld/demo/stub",
    "crates/aqr-ld/demo/modadd",
    "crates/aqr-ld/demo/modxor",
    "crates/aqr-ld/demo/modpanic",
    "codecs/*",
]
# The benches are standalone, with the checkouts of third_party/ (some of them workspaces of their
# own).
exclude = ["third_party", "codecs/aqr-flate/bench", "codecs/aqr-png/bench"]

[workspace.dependencies]
# Every version and path of the members' dependencies (generated aqr-dll-* aside). Default features
# are off where a member takes a crate without them; the members that want them say
# `default-features = true`.

# DEFLATE encoders for aqr-flate's training and the tests of aqr-flate, aqr-png and aqr-pdf. The
# backends here work with MSVC as well; the crates add the others for
# `cfg(not(target_env = "msvc"))`: zlib-ng, zlib-chromium, libslz, cryptopp, go, gzip, infozip and
# ect do not build, and zlib-cloudflare builds but takes zlib's symbols (or zlib its), the other
# one then refusing every stream.
flate-zoo = { version = "1.0.0", default-features = false, features = [
    "zlib", "libdeflate", "zopfli", "miniz", "stb", "lodepng", "sdefl", "uzlib",
    "7zip", "advancecomp-7z", "apple", "rust", "js", "isa-l",
] }

# zstd without its default features, so that no crate brings them back: `legacy` (the decoders of
# the formats before 1.0, which Aqueous never reads) is off; `zdict_builder` is aqr-formula's.
zstd = { version = "0.13", default-features = false }

aes = "0.8"
block2 = "0.6"
cbc = "0.1"
chacha20 = "0.9"
chacha20poly1305 = { version = "0.10", default-features = false }
crc-fast = { version = "1.10", default-features = false, features = ["std"] }
crc32fast = "1.5"
ctr = "0.9"
embed-resource = "3"
encoding_rs = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
hkdf = "0.12"
hmac = "0.12"
inventory = "0.3"
libc = "0.2"
liblzma = { version = "0.4", default-features = false }
memchr = "2"
memmap2 = "0.9"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSActionCell",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSSecureTextField",
    "NSRunningApplication",
    "NSScrollView",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableView",
    "NSText",
    "NSTextField",
    "NSTextFieldCell",
    "NSTextView",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSBundle",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSIndexSet",
    "NSNotification",
    "NSObject",
    "NSProgress",
    "NSString",
    "NSThread",
    "NSTimer",
    "NSURL",
    "NSValue",
] }
pbkdf2 = "0.12"
rayon = "1.12"
scrypt = { version = "0.11", default-features = false }
serde_json = "1"
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
# (aqr-compress's --lossy: the digests of a file looked for in the others)
aho-corasick = "1"
blake2 = { version = "0.10", default-features = false }
md-5 = { version = "0.10", default-features = false }
simd-adler32 = "0.3"
toml = "1"
unicode-normalization = "0.1"
wah = { version = "2690", default-features = false, features = [
    "jit", "wasm2", "memory64", "multi-memory",
] }
walrus = "0.27"
# aqr-ld takes the version walrus does.
wasmparser = "0.258"
wasmtime = { version = "49", default-features = false, features = [
    "cranelift", "runtime", "std", "parallel-compilation", "async",
] }
wat = "1"
windows-sys = "0.61"
xxhash-rust = "0.8"
zmij = "1"

