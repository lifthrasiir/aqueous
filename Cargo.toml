[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/aqr-api/demo/concat",
    "crates/aqr-api/demo/xor",
    "crates/aqr-api/demo/split",
    "codecs/*",
]
# flate-zoo is a submodule with a workspace of its own; the benches are standalone, with the
# checkouts of third_party/ (some of them workspaces of their own).
exclude = ["flate-zoo", "third_party", "codecs/aqr-flate/bench", "codecs/aqr-png/bench"]

[workspace.dependencies]
# DEFLATE encoders for aqr-flate's training and the tests of aqr-flate, aqr-png and aqr-pdf, from
# crates.io (the submodule is not needed to build). The backends here work with MSVC as well;
# the crates add the others for `cfg(not(target_env = "msvc"))`: zlib-ng, zlib-chromium, libslz,
# cryptopp, go, gzip, infozip and ect do not build, and zlib-cloudflare builds but takes zlib's
# symbols (or zlib its), the other one then refusing every stream.
flate-zoo = { version = "1.0.0", default-features = false, features = [
    "zlib", "libdeflate", "zopfli", "miniz", "stb", "lodepng", "sdefl", "uzlib",
    "7zip", "advancecomp-7z", "apple", "rust", "js", "isa-l",
] }

# Thin-local LTO and 16 codegen units (Cargo's defaults) rather than fat LTO and one unit: on an
# M4 the build of `aqr` from scratch 148 -> 73 s, after touching aqr-flate 113 -> 20 s, after
# touching aqr 98 -> 1.5 s; 10gb compressed +0.7% instructions retired, tested +0.3%, the same
# wall-clock within noise (thin LTO: +0.4% and +0.3%, but 31 s after touching aqr).
[profile.release]
debug = 1

[profile.release.package.aqr-flac]
debug = true

[profile.release.package.aqr-jpeg]
debug = true

[profile.release.package.aqr-mp3]
debug = true

[profile.release.package.aqr-raw]
debug = true

# For the tests (`cargo rt`, an alias of `cargo test --profile release-test`): optimised, as the
# tests are slow otherwise, and incremental. The timings (`--ignored` tests) still want `-r`.
[profile.release-test]
inherits = "release"
incremental = true
debug = "line-tables-only"

# Its generated lowering does not split into codegen units: 80 s on the critical path at
# opt-level 1 or 3, 20 s at 0; the tests compile little Wasm with it (+2 s of 65 s).
[profile.release-test.package.cranelift-codegen]
opt-level = 0

# Binaries for distribution (`cargo build --profile dist -p aqr`, `cargo win7`): fat LTO and one
# codegen unit for the last 0.3-0.7% of instructions (profile.release has the numbers).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The Wasm modules (crates/aqr-modules/build.sh, aqr-exe/build-wasm.bat): fat LTO and one
# codegen unit as in dist, for small modules and for their bytes (hence hashes) to stay as they
# were.
[profile.release-wasm]
inherits = "dist"
debug = false
strip = true
