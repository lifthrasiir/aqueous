[package]
name = "aqr-fuzz"
version = "0.0.0"
edition = "2024"
description = "Fuzz targets of the archive decoder (cargo fuzz, nightly): its checksums skipped by cfg(fuzzing)"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: libFuzzer's binaries stay out of the main one's builds and tests.
[workspace]

[dependencies]
aqr-archive = { path = "../crates/aqr-archive" }
aqr-compress = { path = "../crates/aqr-compress" }
aqr-decompress = { path = "../crates/aqr-decompress" }
aqr-formula = { path = "../crates/aqr-formula" }
aqr-pack = { path = "../crates/aqr-pack" }
aqr-blob = { path = "../crates/aqr-blob" }
aqr-sfx = { path = "../crates/aqr-sfx", features = ["encode", "xz"] }
aqr-testkit = { path = "../crates/aqr-testkit" }
aqr-unpack = { path = "../crates/aqr-unpack" }
aqr-wasmrt = { path = "../crates/aqr-wasmrt" }
flate2 = "1"
sha2 = "0.10"
wasm-smith = { version = "0.262", features = ["wasmparser"] }
wasm-encoder = { version = "0.262", features = ["wasmparser"] }
wasmparser = "0.262"
wat = "1"
zstd = "0.13"
libfuzzer-sys = "0.4"

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "salvage"
path = "fuzz_targets/salvage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wasm"
path = "fuzz_targets/wasm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unpack"
path = "fuzz_targets/unpack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "modules"
path = "fuzz_targets/modules.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pack"
path = "fuzz_targets/pack.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sfx"
path = "fuzz_targets/sfx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress"
path = "fuzz_targets/compress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "natives"
path = "fuzz_targets/natives.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seeds"
path = "src/bin/seeds.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
