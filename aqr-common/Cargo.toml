[package]
name = "aqr-common"
version = "0.1.0"
edition = "2024"
description = "Building blocks shared by the aqr-* recompressors: varints, rANS coders, bit I/O, heap accounting"
publish = false

[features]
# Serialised frequency tables for built-in models (`rans64::builtin`).
zstd = ["dep:zstd"]
# Phase marks of `mem::mark`, to stderr.
memprof = []
# rayon thread pools whose threads are workers of `pool` (`pool::rayon_pool`).
rayon = ["dep:rayon"]

[dependencies]
zstd = { version = "0.13", optional = true }
rayon = { version = "1.12", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
