[package]
name = "aqr-api"
version = "0.1.0"
edition = "2024"
description = "The interface of aqr modules for Rust, lowered by aqr-ld on Wasm and emulated natively"
publish = false

[features]
default = ["panic-handler"]
# On Wasm, a `#[panic_handler]` trapping without formatting the message; off for modules using std.
panic-handler = []
# The panic handler logs the location first, at the cost of the message templates of the panics (~2 KB).
panic-location = ["panic-handler"]

[dev-dependencies]
aqr-formula = { path = "../aqr-formula" }
