[package]
name = "aqr-decompress"
version = "0.1.0"
edition = "2024"
description = "Runs the modules of entry formulas natively, and decompresses Aqueous archives with them"
publish = false

[features]
default = ["wasm", "sandbox"]
# Modules that are not known run as WebAssembly, by Wasmtime.
wasm = ["dep:wasmtime", "dep:wasmparser", "dep:windows-sys"]
# ... or so in worker processes locked down by the system (`sandbox`).
sandbox = ["wasm"]

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-formula = { path = "../aqr-formula" }
aqr-modules = { path = "../aqr-modules" }
sha2 = "0.10"
wasmparser = { version = "0.245", optional = true }
wasmtime = { version = "49", optional = true, default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation", "async"] }
aqr-bundle = { path = "../aqr-bundle" }
aqr-exe = { path = "../aqr-exe", default-features = false, features = ["decode"] }
aqr-flate = { path = "../aqr-flate" }
aqr-fasta = { path = "../aqr-fasta" }
aqr-flac = { path = "../aqr-flac" }
aqr-jpeg = { path = "../aqr-jpeg" }
aqr-lz4 = { path = "../aqr-lz4" }
aqr-lzma = { path = "../aqr-lzma" }
aqr-lzo = { path = "../aqr-lzo" }
aqr-mp3 = { path = "../aqr-mp3" }
aqr-pdf = { path = "../aqr-pdf" }
aqr-png = { path = "../aqr-png" }
aqr-psd = { path = "../aqr-psd" }
aqr-clip = { path = "../aqr-clip" }
aqr-raw = { path = "../aqr-raw" }
aqr-snappy = { path = "../aqr-snappy" }
aqr-zip = { path = "../aqr-zip" }
aqr-sqlite = { path = "../aqr-sqlite" }
aqr-tex = { path = "../aqr-tex" }
aqr-wrt = { path = "../aqr-wrt" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
wat = "1"

# Tools are named <crate>-<tool>, so that names do not collide in the workspace's target
# directory.

# A worker of the sandbox, for the tests and for hosts of no worker of their own.
[[bin]]
name = "aqr-decompress-worker"
path = "src/bin/worker.rs"
required-features = ["sandbox"]

[[example]]
name = "aqr-decompress-modules"
path = "examples/modules.rs"

[[example]]
name = "aqr-decompress-wasm"
path = "examples/wasm.rs"
required-features = ["wasm"]
