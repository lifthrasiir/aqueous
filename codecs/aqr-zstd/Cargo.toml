[package]
name = "aqr-zstd"
version = "0.1.0"
edition = "2024"
description = "Zstandard frames decompressed by the archive's Patch instructions, so that what they hold is shared with other files"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the structure of frames alone.
encode = ["dep:aqr-formula", "dep:zstd"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-sqlite = { workspace = true, default-features = true }
aqr-testkit.workspace = true
zstd.workspace = true

# libzstd's frames made again: of pairs of contents and frames, and of a database's blobs
[[example]]
name = "zcheck"
required-features = ["encode"]

[[example]]
name = "dbframes"
required-features = ["encode"]
