[package]
name = "aqr-b2t"
version = "0.1.0"
edition = "2024"
description = "Base64 blocks in text files (MIME, PEM, data URIs, JSON) decoded for the decoded bytes to be recompressed, and written again bit for bit"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-formula.workspace = true
aqr-testkit.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-b2t-check"
path = "examples/check.rs"
