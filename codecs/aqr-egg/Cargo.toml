[package]
name = "aqr-egg"
version = "0.1.0"
edition = "2024"
description = "EGG archives (ALZip's) taken apart into their files' contents, DEFLATE by aqr-flate, bzip2 by aqr-bz2, LZMA by aqr-lzma and AZO by aqr-azo"
publish = false

[dependencies]
aqr-common.workspace = true
aqr-formula.workspace = true
aqr-flate = { workspace = true, default-features = true }
aqr-bz2 = { workspace = true, default-features = true }
aqr-lzma = { workspace = true, default-features = true }
aqr-azo = { workspace = true, default-features = true }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-egg-check"
path = "examples/check.rs"

[dev-dependencies]
aqr-archive.workspace = true
aqr-testkit.workspace = true
