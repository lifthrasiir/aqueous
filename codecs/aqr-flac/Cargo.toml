[package]
name = "aqr-flac"
version = "0.1.0"
edition = "2024"

[features]
default = ["encode"]
# The formulas (`formula`) and the built-in model; without it, the code of the module alone
# (`module`).
encode = ["dep:aqr-formula", "aqr-common/zstd", "aqr-raw/encode"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
memchr.workspace = true
aqr-formula = { workspace = true, optional = true }
aqr-raw.workspace = true

[dev-dependencies]
aqr-archive.workspace = true
aqr-testkit.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, examples/aqr-flac.rs, after the crate),
# so that names do not collide in the workspace's target directory.

[[bin]]
name = "aqr-flac-train"
path = "src/bin/train.rs"

[[example]]
name = "aqr-flac-breakdown"
path = "examples/breakdown.rs"

[[example]]
name = "aqr-flac-dhot"
path = "examples/dhot.rs"

[[example]]
name = "aqr-flac-entbench"
path = "examples/entbench.rs"

[[example]]
name = "aqr-flac-exp2"
path = "examples/exp2.rs"

[[example]]
name = "aqr-flac-hot"
path = "examples/hot.rs"

[[example]]
name = "aqr-flac-lmsbench"
path = "examples/lmsbench.rs"

[[example]]
name = "aqr-flac-rt"
path = "examples/rt.rs"
