[package]
name = "aqr-fsb"
version = "0.1.0"
edition = "2024"
description = "FMOD's FSB5 sound banks: split into their samples; the Vorbis setup headers they leave out, rebuilt from a database"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }
aqr-ima = { workspace = true, default-features = true }
aqr-vorbis = { workspace = true, default-features = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-formula.workspace = true
aqr-testkit.workspace = true
