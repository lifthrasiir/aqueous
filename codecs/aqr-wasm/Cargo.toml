[package]
name = "aqr-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly modules rebuilt bit for bit from their code split into streams by the instructions' fields"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }

[dev-dependencies]
zstd = "0.13"

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-wasm-bench"
path = "examples/bench.rs"
