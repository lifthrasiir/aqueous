[package]
name = "aqr-hdf5"
version = "0.1.0"
edition = "2024"
description = "HDF5 files rebuilt bit for bit: the deflated chunks of their datasets rebuilt by aqr-flate from their data"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`).
encode = ["dep:aqr-formula", "dep:zstd", "aqr-flate/encode"]

[dependencies]
aqr-api.workspace = true
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }
aqr-flate.workspace = true
zstd = { workspace = true, optional = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-formula.workspace = true
aqr-testkit.workspace = true
zstd.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-hdf5-check"
path = "examples/check.rs"
required-features = ["encode"]
