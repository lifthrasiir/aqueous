[package]
name = "aqr-minecraft"
version = "0.1.0"
edition = "2024"
description = "Minecraft's region files (.mca) rebuilt bit for bit from their chunks' data, the zlib streams made again by aqr-flate's emulation of zlib"
publish = false

[features]
default = ["encode"]
# The formula (`formula`) and the tool; without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:flate2", "dep:zstd", "dep:aqr-sqlite", "aqr-zstd/encode"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
aqr-flate.workspace = true
aqr-formula = { workspace = true, optional = true }
aqr-zstd.workspace = true
aqr-sqlite = { workspace = true, default-features = true, optional = true }
flate2 = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[bin]]
name = "aqr-minecraft"
path = "src/main.rs"
required-features = ["encode"]

[dev-dependencies]
aqr-sqlite = { workspace = true, default-features = true }
aqr-testkit.workspace = true

[[example]]
name = "dhcheck"
required-features = ["encode"]

[[example]]
name = "dhlods"
required-features = ["encode"]
