[package]
name = "aqr-dex"
version = "0.1.0"
edition = "2024"
description = "Android DEX files rebuilt bit for bit from their strings, tables and sections split into streams"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api.workspace = true
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }
sha1.workspace = true

[dev-dependencies]
aqr-archive.workspace = true
aqr-testkit.workspace = true
zstd.workspace = true

# Tools are named <crate>-<tool>, so that names do not collide in the workspace's target
# directory.

[[example]]
name = "aqr-dex-check"
path = "examples/check.rs"

[[example]]
name = "aqr-dex-bench"
path = "examples/bench.rs"
