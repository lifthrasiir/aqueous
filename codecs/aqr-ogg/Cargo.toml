[package]
name = "aqr-ogg"
version = "0.1.0"
edition = "2024"
description = "Ogg files rebuilt bit for bit from their streams' packets and the pages' layout, the lacing, flags, sequence numbers, granule positions and CRCs derived; Vorbis packets through aqr-vorbis"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:aqr-vorbis"]

[dependencies]
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }
aqr-vorbis = { path = "../aqr-vorbis", optional = true }

[dev-dependencies]
aqr-formula = { path = "../../crates/aqr-formula" }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-ogg-check"
path = "examples/check.rs"
