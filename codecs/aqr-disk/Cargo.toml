[package]
name = "aqr-disk"
version = "0.1.0"
edition = "2024"
description = "Disk images taken apart into the contents of their files and the rest: partition tables, the formula the file systems' readers share, without a module"
publish = false

[dependencies]
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula" }
aqr-lzx = { path = "../aqr-lzx" }

[dev-dependencies]
# (file systems to read the containers' disks with)
aqr-ext = { path = "../aqr-ext" }
aqr-ntfs = { path = "../aqr-ntfs" }
zstd = "0.13"
