[package]
name = "aqr-disk"
version = "0.1.0"
edition = "2024"
description = "Disk images taken apart into the contents of their files and the rest: partition tables, the formula the file systems' readers share, without a module"
publish = false

[dependencies]
aqr-common.workspace = true
aqr-formula.workspace = true
aqr-lznt1 = { workspace = true, default-features = true }
aqr-lzx = { workspace = true, default-features = true }
aqr-xpress = { workspace = true, default-features = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-testkit.workspace = true
flate2.workspace = true
# (file systems to read the containers' disks with)
aqr-ext.workspace = true
aqr-ntfs.workspace = true
zstd.workspace = true
