[package]
name = "aqr-div3"
version = "0.1.0"
edition = "2024"
description = "DivX 3 (MS-MPEG4 v3) video frames of AVI files re-coded by a context model, rebuilt bit for bit"
publish = false

[features]
default = ["encode"]
# The formula (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:aqr-ac3", "aqr-ac3/encode"]

[dependencies]
aqr-api = { path = "../../crates/aqr-api", default-features = false, features = ["alloc"] }
aqr-common = { path = "../../crates/aqr-common" }
aqr-walk = { path = "../../crates/aqr-walk" }
aqr-ac3 = { path = "../aqr-ac3", default-features = false, optional = true }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }

[[example]]
name = "aqr-div3-check"
path = "examples/check.rs"

[[example]]
name = "aqr-div3-speed"
path = "examples/speed.rs"
