[package]
name = "aqr-div3"
version = "0.1.0"
edition = "2024"
description = "DivX 3 (MS-MPEG4 v3) video frames of AVI files re-coded by a context model, rebuilt bit for bit"
publish = false

[features]
default = ["encode"]
# The formula (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:aqr-ac3", "aqr-ac3/encode", "dep:aqr-mp3"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
aqr-walk.workspace = true
aqr-ac3 = { workspace = true, optional = true }
aqr-formula = { workspace = true, optional = true }
aqr-mp3 = { workspace = true, default-features = true, optional = true }

[[example]]
name = "aqr-div3-check"
path = "examples/check.rs"

[[example]]
name = "aqr-div3-speed"
path = "examples/speed.rs"

[dev-dependencies]
aqr-archive.workspace = true
aqr-testkit.workspace = true
