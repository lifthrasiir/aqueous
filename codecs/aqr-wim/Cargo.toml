[package]
name = "aqr-wim"
version = "0.1.0"
edition = "2024"
description = "WIM files taken apart into their resources' data, LZX chunks rebuilt by aqr-lzx, without a module of their own"
publish = false

[dependencies]
aqr-common.workspace = true
aqr-formula.workspace = true
aqr-lzx = { workspace = true, default-features = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-decompress.workspace = true
memmap2.workspace = true
aqr-testkit.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-wim-check"
path = "examples/check.rs"
