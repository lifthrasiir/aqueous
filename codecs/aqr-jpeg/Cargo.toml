[package]
name = "aqr-jpeg"
version = "0.1.0"
edition = "2024"

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
memchr.workspace = true
aqr-formula = { workspace = true, optional = true }

# (in WebAssembly, `par` runs in order on the calling thread)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
aqr-common = { workspace = true, features = ["rayon"] }
rayon.workspace = true

[dev-dependencies]
aqr-archive.workspace = true
# (the registry of `-Z`, for tests/regress.rs)
aqr-common = { workspace = true, features = ["registry"] }
aqr-testkit.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, examples/aqr-jpeg.rs, after the crate),
# so that names do not collide in the workspace's target directory.

[[bin]]
name = "aqr-jpeg-decbench"
path = "src/bin/decbench.rs"

[[bin]]
name = "aqr-jpeg-huffbench"
path = "src/bin/huffbench.rs"
