[package]
name = "aqr-jpeg"
version = "0.1.0"
edition = "2024"

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-common = { path = "../../crates/aqr-common" }
memchr = "2"
aqr-formula = { path = "../../crates/aqr-formula", optional = true }

# (in WebAssembly, `par` runs in order on the calling thread)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
aqr-common = { path = "../../crates/aqr-common", features = ["rayon"] }
rayon = "1.12.0"

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[bin]]
name = "aqr-jpeg-decbench"
path = "src/bin/decbench.rs"

[[bin]]
name = "aqr-jpeg-huffbench"
path = "src/bin/huffbench.rs"
