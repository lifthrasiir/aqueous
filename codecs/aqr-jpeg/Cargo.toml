[package]
name = "aqr-jpeg"
version = "0.1.0"
edition = "2024"

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api = { path = "../../crates/aqr-api", default-features = false, features = ["alloc"] }
aqr-common = { path = "../../crates/aqr-common" }
memchr = "2"
aqr-formula = { path = "../../crates/aqr-formula", optional = true }

# (in WebAssembly, `par` runs in order on the calling thread)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
aqr-common = { path = "../../crates/aqr-common", features = ["rayon"] }
rayon = "1.12.0"

[dev-dependencies]
aqr-archive = { path = "../../crates/aqr-archive" }
# (the registry of `-Z`, for tests/regress.rs)
aqr-common = { path = "../../crates/aqr-common", features = ["registry"] }
aqr-testkit = { path = "../../crates/aqr-testkit" }

# Tools are named <crate>-<tool> (the crate's own one, examples/aqr-jpeg.rs, after the crate),
# so that names do not collide in the workspace's target directory.

[[bin]]
name = "aqr-jpeg-decbench"
path = "src/bin/decbench.rs"

[[bin]]
name = "aqr-jpeg-huffbench"
path = "src/bin/huffbench.rs"
