[package]
name = "aqr-raw"
version = "0.1.0"
edition = "2024"
description = "Uncompressed sampled data, PCM audio and raster images: their models as a library, and as modules of entry formulas with the trivial containers (WAV, AIFF, BMP, PNM) taken apart, IMA ADPCM blocks of WAV by aqr-ima"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`) and the built-in tables; without it, the code of the modules alone
# (`module`).
encode = ["dep:aqr-formula", "dep:aqr-ima", "dep:aqr-msadpcm", "aqr-common/zstd"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }
# IMA ADPCM blocks of WAV files, in the formulas.
aqr-ima = { workspace = true, default-features = true, optional = true }
aqr-msadpcm = { workspace = true, default-features = true, optional = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-testkit.workspace = true
