[package]
name = "aqr-bundle"
version = "0.1.0"
edition = "2024"
description = "ar, tar (v7, ustar, GNU, pax) and cpio archives rebuilt bit for bit from the contents of their members, with their headers' sizes and checksums derived"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
# The packs of game engines (`packs`) are formulas of aqr-disk's, of no module.
encode = ["dep:aqr-formula", "dep:aqr-disk", "dep:aqr-lz4", "dep:aqr-flate", "dep:aqr-msadpcm", "dep:aqr-tex", "dep:aqr-raw"]

[dependencies]
aqr-api.workspace = true
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }
aqr-disk = { workspace = true, optional = true }
aqr-lz4 = { workspace = true, optional = true }
aqr-flate = { workspace = true, optional = true }
aqr-msadpcm = { workspace = true, default-features = true, optional = true }
aqr-tex = { workspace = true, default-features = true, optional = true }
aqr-raw = { workspace = true, default-features = true, optional = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-testkit.workspace = true
zstd.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-bundle-check"
path = "examples/check.rs"

[[example]]
name = "aqr-bundle-packs"
path = "examples/packs.rs"

[[example]]
name = "aqr-bundle-textures"
path = "examples/textures.rs"
