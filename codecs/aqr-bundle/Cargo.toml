[package]
name = "aqr-bundle"
version = "0.1.0"
edition = "2024"
description = "ar, tar (v7, ustar, GNU, pax) and cpio archives rebuilt bit for bit from the contents of their members, with their headers' sizes and checksums derived"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
# The packs of game engines (`packs`) are formulas of aqr-disk's, of no module.
encode = ["dep:aqr-formula", "dep:aqr-disk", "dep:aqr-lz4", "dep:aqr-flate"]

[dependencies]
aqr-api = { path = "../../crates/aqr-api", default-features = false }
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }
aqr-disk = { path = "../aqr-disk", optional = true }
aqr-lz4 = { path = "../aqr-lz4", default-features = false, optional = true }
aqr-flate = { path = "../aqr-flate", default-features = false, optional = true }

[dev-dependencies]
zstd = "0.13"

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-bundle-check"
path = "examples/check.rs"

[[example]]
name = "aqr-bundle-packs"
path = "examples/packs.rs"
