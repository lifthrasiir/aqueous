[package]
name = "aqr-prores"
version = "0.1.0"
edition = "2024"
description = "Apple ProRes frames rebuilt bit for bit from their coefficients, which a context model codes with the previous frame as context"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]
# Synthetic frames (`synth`), for the tests of other crates.
synth = []

[dependencies]
aqr-api = { path = "../../crates/aqr-api", default-features = false, features = ["alloc"] }
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }
memchr = "2"

[dev-dependencies]
memmap2 = "0.9"
rayon = "1.12.0"
zstd = "0.13"

# Tools are named <crate>-<tool>, so that names do not collide in the workspace's target
# directory.

[[example]]
name = "aqr-prores-check"
path = "examples/check.rs"

[[example]]
name = "aqr-prores-model"
path = "examples/model.rs"

[[example]]
name = "aqr-prores-bench"
path = "examples/bench.rs"
