[package]
name = "aqr-sqlite"
version = "0.1.0"
edition = "2024"
description = "Lossless SQLite3 database recompression: bit-exact reconstruction from a smaller representation"
publish = false

[dependencies]
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]
# Heap use at phase marks, to stderr.
memprof = ["aqr-common/memprof"]
