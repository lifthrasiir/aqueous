[package]
name = "aqr-fits"
version = "0.1.0"
edition = "2024"
description = "FITS files rebuilt bit for bit: integer images coded by a pixel model, Rice-compressed tiles (fpack) rebuilt from their pixels, binary tables by column"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the modules alone (`module`).
encode = ["dep:aqr-formula", "dep:zstd"]

[dependencies]
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
aqr-formula = { path = "../../crates/aqr-formula" }
zstd = "0.13"

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-fits-bench"
path = "examples/bench.rs"
