[package]
name = "aqr-tensors"
version = "0.1.0"
edition = "2024"
description = "Files of tensors (GGUF, torch.save, safetensors) rebuilt bit for bit: the floats' exponents, the quantised blocks' nibbles and the indices of grids (weights of lower precisions converted) coded by a SIMD rANS of 16 symbols, the rest as it is"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:aqr-archive"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }
# (the size of the archive's blocks, for bounding a formula)
aqr-archive = { workspace = true, optional = true }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-tensors-bench"
path = "examples/bench.rs"

[dev-dependencies]
aqr-formula.workspace = true
memmap2.workspace = true
zstd.workspace = true
aqr-testkit.workspace = true
