[package]
name = "aqr-asar"
version = "0.1.0"
edition = "2024"
description = "Electron's asar archives rebuilt bit for bit from the data after their header, with the files' sizes, offsets and SHA-256 integrity derived"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
zstd = "0.13"

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-asar-check"
path = "examples/check.rs"
