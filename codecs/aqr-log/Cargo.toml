[package]
name = "aqr-log"
version = "0.1.0"
edition = "2024"
description = "Lines of text (logs, tables of numbers) rebuilt bit for bit from a template for each line and its fields stored in columns"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:zstd", "dep:memchr"]

[dependencies]
aqr-api = { path = "../../crates/aqr-api", default-features = false }
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }
aqr-num = { path = "../../crates/aqr-num" }
memchr = { version = "2", optional = true }
zstd = { version = "0.13", optional = true }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-log-bench"
path = "examples/bench.rs"
required-features = ["encode"]
