[package]
name = "aqr-fat"
version = "0.1.0"
edition = "2024"
description = "FAT12, FAT16, FAT32 and exFAT volumes read into their files, file systems of aqr-disk"
publish = false

[dependencies]
aqr-disk.workspace = true

[dev-dependencies]
aqr-archive.workspace = true
aqr-formula.workspace = true
aqr-testkit.workspace = true
zstd.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-fat-check"
path = "examples/check.rs"
