[package]
name = "aqr-pdb"
version = "0.1.0"
edition = "2024"
description = "PDB files (MSF) rebuilt bit for bit from their streams and the records in them"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the modules alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api = { path = "../../crates/aqr-api", default-features = false }
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }

[dev-dependencies]
aqr-formula = { path = "../../crates/aqr-formula" }
zstd = "0.13"

# Tools are named <crate>-<tool>, so that names do not collide in the workspace's target
# directory.

[[example]]
name = "aqr-pdb-check"
path = "examples/check.rs"
