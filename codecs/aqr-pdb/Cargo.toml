[package]
name = "aqr-pdb"
version = "0.1.0"
edition = "2024"
description = "PDB files (MSF) rebuilt bit for bit from their streams and the records in them"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the modules alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-testkit.workspace = true
aqr-formula.workspace = true
zstd.workspace = true

# Tools are named <crate>-<tool>, so that names do not collide in the workspace's target
# directory.

[[example]]
name = "aqr-pdb-check"
path = "examples/check.rs"
