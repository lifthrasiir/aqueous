[package]
name = "aqr-tex"
version = "0.1.0"
edition = "2024"
description = "Block-compressed textures (BC1 to BC7, ETC1, ETC2, EAC, PVRTC1) rebuilt bit for bit from their endpoints and indices, coded by context models in the pixel domain, and the containers around them (DDS, KTX, KTX 2, PVR)"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`, uncompressed pixels by aqr-raw's module); without it, the code of
# the module alone (`module`).
encode = ["dep:aqr-formula", "dep:aqr-raw"]

[dependencies]
# Tasks for the stripes of a texture (`texture`) in the module of aqr-modules; its plan.
aqr-api = { path = "../../crates/aqr-api", default-features = false, features = ["alloc"] }
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }
aqr-raw = { path = "../aqr-raw", optional = true }

[dev-dependencies]
aqr-formula = { path = "../../crates/aqr-formula" }
aqr-raw = { path = "../aqr-raw" }
zstd = "0.13"

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-tex-bench"
path = "examples/bench.rs"
