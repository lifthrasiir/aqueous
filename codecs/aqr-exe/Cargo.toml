[package]
name = "aqr-exe"
version = "0.1.0"
edition = "2021"

[features]
default = ["encode", "decode"]
encode = []
decode = []

[dependencies]
aqr-api = { path = "../../crates/aqr-api", default-features = false, features = ["alloc"] }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }

# (ARMv8's SHA-2 instructions, which sha2 takes only with "asm"; x86's SHA-NI it takes as it is)
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["asm"] }

[dev-dependencies]
zstd = { version = "0.13", features = ["zstdmt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(trace_decode)', 'cfg(trace_encode)'] }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-exe-bench"
path = "examples/bench.rs"

[[example]]
name = "aqr-exe-bench-arm64"
path = "examples/bench-arm64.rs"

[[example]]
name = "aqr-exe-bench-remap"
path = "examples/bench-remap.rs"

[[example]]
name = "aqr-exe-bench-delta"
path = "examples/bench-delta.rs"

[[example]]
name = "aqr-exe-bench-codesign"
path = "examples/bench-codesign.rs"
