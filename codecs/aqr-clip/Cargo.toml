[package]
name = "aqr-clip"
version = "0.1.0"
edition = "2024"
description = "Clip Studio Paint files (.clip): tiles coded by a model of whole pixels, their zlib streams made again, the database by aqr-sqlite"
publish = false

[features]
default = ["encode"]
# The formula (`formula`), the static-table model and the research tool; without it, the code
# of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:aqr-sqlite", "dep:aqr-psd", "dep:aqr-raw"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
aqr-flate.workspace = true
aqr-formula = { workspace = true, optional = true }
aqr-psd = { workspace = true, default-features = true, optional = true }
aqr-raw = { workspace = true, default-features = true, optional = true }
aqr-sqlite = { workspace = true, default-features = true, optional = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-testkit.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, examples/aqr-clip.rs, after the crate),
# so that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-clip"
path = "examples/aqr-clip.rs"
required-features = ["encode"]
