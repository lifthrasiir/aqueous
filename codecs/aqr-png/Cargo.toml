[package]
name = "aqr-png"
version = "0.1.0"
edition = "2024"
description = "Lossless PNG recompression: bit-exact reconstruction from a smaller representation"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the modules alone (`module`).
encode = ["dep:aqr-formula", "aqr-flate/encode", "aqr-raw/encode"]

[dependencies]
aqr-api = { workspace = true, features = ["alloc"] }
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }
aqr-flate.workspace = true
aqr-raw.workspace = true

[dev-dependencies]
aqr-archive.workspace = true
flate-zoo.workspace = true

# flate-zoo's backends that do not work with MSVC (the root Cargo.toml has why).
[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
flate-zoo = { workspace = true, features = [
    "zlib-ng", "zlib-chromium", "zlib-cloudflare", "libslz", "cryptopp", "go", "gzip", "infozip", "ect",
] }

# Tools are named <crate>-<tool> (the crate's own one, examples/aqr-png.rs, after the crate),
# so that names do not collide in the workspace's target directory.

[[bin]]
name = "aqr-png-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "aqr-png-ransbench"
path = "src/bin/ransbench.rs"

[[bin]]
name = "aqr-png-refprobe"
path = "src/bin/refprobe.rs"
