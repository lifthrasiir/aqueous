[package]
name = "aqr-dwarf"
version = "0.1.0"
edition = "2024"
description = "DWARF debugging information rebuilt bit for bit from its records split into streams"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api.workspace = true
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }

[dev-dependencies]
aqr-testkit.workspace = true
zstd.workspace = true

# Tools are named <crate>-<tool>, so that names do not collide in the workspace's target
# directory.

[[example]]
name = "aqr-dwarf-check"
path = "examples/check.rs"
