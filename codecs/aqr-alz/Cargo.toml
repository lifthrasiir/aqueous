[package]
name = "aqr-alz"
version = "0.1.0"
edition = "2024"
description = "ALZ archives (ALZip's) taken apart into their files' contents, DEFLATE by aqr-flate and bzip2 by aqr-bz2"
publish = false

[dependencies]
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula" }
aqr-flate = { path = "../aqr-flate" }
aqr-bz2 = { path = "../aqr-bz2" }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-alz-check"
path = "examples/check.rs"
