[package]
name = "aqr-obj"
version = "0.1.0"
edition = "2024"
description = "Lossless Wavefront OBJ recompression: bit-exact reconstruction from a smaller representation"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`) and the tool; without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api.workspace = true
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }
aqr-num.workspace = true
memchr.workspace = true

[dev-dependencies]
aqr-archive.workspace = true
aqr-formula.workspace = true
aqr-testkit.workspace = true
zstd.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, examples/aqr-obj.rs, after the crate),
# so that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-obj-dups"
path = "examples/dups.rs"

[[example]]
name = "aqr-obj-entropy"
path = "examples/entropy.rs"

[[example]]
name = "aqr-obj-fpred"
path = "examples/fpred.rs"

[[example]]
name = "aqr-obj-fpred2"
path = "examples/fpred2.rs"

[[example]]
name = "aqr-obj-fsym-hist"
path = "examples/fsym_hist.rs"

[[example]]
name = "aqr-obj-repro"
path = "examples/repro.rs"

[[example]]
name = "aqr-obj-vpred"
path = "examples/vpred.rs"

[[example]]
name = "aqr-obj-vpred2"
path = "examples/vpred2.rs"

[[example]]
name = "aqr-obj-vpred-hist"
path = "examples/vpred_hist.rs"

[[example]]
name = "aqr-obj"
path = "examples/aqr-obj.rs"
required-features = ["encode"]
