[package]
name = "aqr-mszip"
version = "0.1.0"
edition = "2024"
description = "CAB and CHM files taken apart into their files' contents, MSZIP and LZX folders rebuilt from their data"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`, `cab`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:aqr-flate", "aqr-lzx/encode"]

[dependencies]
aqr-api.workspace = true
aqr-common.workspace = true
aqr-flate = { workspace = true, default-features = true, optional = true }
aqr-lzx.workspace = true
aqr-formula = { workspace = true, optional = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-decompress.workspace = true
aqr-flate = { workspace = true, default-features = true }
aqr-lzx = { workspace = true, default-features = true }
aqr-testkit.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-mszip-check"
path = "examples/check.rs"

[[example]]
name = "aqr-mszip-lzx"
path = "examples/lzx.rs"
