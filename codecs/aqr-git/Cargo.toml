[package]
name = "aqr-git"
version = "0.1.0"
edition = "2024"
description = "git packs rebuilt bit for bit from their objects' data, the zlib streams by aqr-flate, with headers, checksums and the trailer derived"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula", "aqr-flate/encode"]

[dependencies]
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }
aqr-flate = { path = "../aqr-flate", default-features = false }
sha1 = { version = "0.10", default-features = false }

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zstd = "0.13"

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-git-check"
path = "examples/check.rs"
