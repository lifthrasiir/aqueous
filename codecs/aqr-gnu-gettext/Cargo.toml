[package]
name = "aqr-gnu-gettext"
version = "0.1.0"
edition = "2024"
description = "GNU gettext message catalogs (.mo) rebuilt bit for bit from their strings: the tables of lengths and offsets and the hash table derived"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api.workspace = true
aqr-common.workspace = true
aqr-formula = { workspace = true, optional = true }

[dev-dependencies]
aqr-archive.workspace = true
aqr-formula.workspace = true
aqr-testkit.workspace = true
