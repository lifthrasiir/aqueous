[package]
name = "aqr-msadpcm"
version = "0.1.0"
edition = "2024"
description = "Microsoft ADPCM blocks (WAV's, XACT's) as a record of their headers and nibbles under an adaptive model, and back bit for bit"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula"]

[dependencies]
aqr-api = { path = "../../crates/aqr-api", default-features = false }
aqr-common = { path = "../../crates/aqr-common" }
aqr-formula = { path = "../../crates/aqr-formula", optional = true }

[dev-dependencies]
aqr-formula = { path = "../../crates/aqr-formula" }
zstd = "0.13"

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-msadpcm-check"
path = "examples/check.rs"
