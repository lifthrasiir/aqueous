[package]
name = "aqr-mkv"
version = "0.1.0"
edition = "2024"
description = "Matroska and WebM files with the frames seen before taken from where they were first, without a module"
publish = false

[dependencies]
aqr-formula = { path = "../../crates/aqr-formula" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-mkv-check"
path = "examples/check.rs"
