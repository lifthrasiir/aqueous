[package]
name = "aqr-mkv"
version = "0.1.0"
edition = "2024"
description = "Matroska and WebM files with the frames seen before taken from where they were first, without a module"
publish = false

[dependencies]
aqr-common.workspace = true
aqr-formula.workspace = true
# (`description_bound`, what a formula takes in an archive)
aqr-archive.workspace = true
xxhash-rust = { workspace = true, features = ["xxh3"] }

[dev-dependencies]
aqr-testkit.workspace = true

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-mkv-check"
path = "examples/check.rs"
