[package]
name = "png-recons-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Compares png-recons with preflate-rs, precomp, paq8px and generic compressors"

# Standalone: needs the third_party/ checkouts and builds of fetch.sh.
[workspace]

[dependencies]
png-recons = { path = ".." }
preflate-container = { path = "../third_party/preflate-rs/container" }
libc = "0.2"

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1
