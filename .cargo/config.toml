[alias]
# The tests, optimised without LTO (Cargo.toml, profile.release-test).
rt = "test --profile release-test"
# The release `aqr`, built unless a binary of the same sources is kept, then run with the
# arguments; `cargo aqr +` lists the kept binaries, `cargo aqr +<id> …` runs one
# (crates/aqr-bincache).
aqr = "run -q -p aqr-bincache --"
# The release's Windows binaries (`cargo +NIGHTLY win7 -p aqr -p aqr-win`, NIGHTLY the toolchain
# of nightly-toolchain): std built for the target (tier 3) of Windows 7 on, the C runtime linked
# statically (no redistributable to install). What newer systems add is looked up as it runs;
# std's locks are SRW locks rather than of WaitOnAddress, no slower (10gb at -5, 2026-11-17).
win7 = "build --profile dist --target x86_64-win7-windows-msvc -Zbuild-std"

# Windows 10 on (the builds of development): the Visual C++ runtime linked statically (no Windows carries vcruntime140.dll:
# the redistributable installs it), the UCRT of the system (Windows 10's own) linked as a DLL.
# The blobs (the no-TLS target's builds, of Windows 7 on) still import vcruntime140.dll and the
# UCRT's DLLs; the programs placing them bind those imports to their own (aqr_blob::CRT_TABLE).
# The libraries a program imports are taken from System32 alone (`/DEPENDENTLOADFLAG`, of
# LOAD_LIBRARY_SEARCH_SYSTEM32; Windows 10 1607 on): bcryptprimitives.dll and the others not of
# KnownDLLs would otherwise be looked for beside the program first, where a self-extracting
# archive or aqr-win.exe run from a folder of downloads would take one planted there.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/NODEFAULTLIB:libucrt.lib",
    "-C", "link-arg=/DEFAULTLIB:ucrt.lib",
    "-C", "link-arg=/DEPENDENTLOADFLAG:0x800",
]

[target.x86_64-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/DEPENDENTLOADFLAG:0x800"]
