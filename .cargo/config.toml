[alias]
# The tests, optimised without LTO (Cargo.toml, profile.release-test).
rt = "test --profile release-test"
# The release `aqr`, built unless a binary of the same sources is kept, then run with the
# arguments; `cargo aqr +` lists the kept binaries, `cargo aqr +<id> …` runs one
# (crates/aqr-bincache).
aqr = "run -q -p aqr-bincache --"
# For Windows 7 and 8 (`cargo +NIGHTLY win7 -p aqr`, NIGHTLY the toolchain of nightly-toolchain):
# std built for the target (tier 3) of the systems before Windows 10, the C runtime linked
# statically (no redistributable to install).
win7 = "build --profile dist --target x86_64-win7-windows-msvc -Zbuild-std"

# Windows 10 on: the Visual C++ runtime linked statically (no Windows carries vcruntime140.dll:
# the redistributable installs it), the UCRT of the system (Windows 10's own) linked as a DLL.
# The blobs (the no-TLS target's builds) still import vcruntime140.dll; the programs placing them
# bind those imports to their own copy (aqr_blob::VCRUNTIME).
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/NODEFAULTLIB:libucrt.lib",
    "-C", "link-arg=/DEFAULTLIB:ucrt.lib",
]

[target.x86_64-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
