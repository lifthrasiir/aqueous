[package]
name = "aqr-xsv"
version = "0.1.0"
edition = "2024"
description = "Delimited text tables (CSV, TSV, USV and the like) rebuilt bit for bit from their columns, numbers coded as integers"
publish = false

[features]
default = ["encode"]
# The formulas (`formula`); without it, the code of the module alone (`module`).
encode = ["dep:aqr-formula", "dep:zstd", "dep:memchr"]

[dependencies]
aqr-common = { path = "../aqr-common" }
aqr-formula = { path = "../aqr-formula", optional = true }
aqr-num = { path = "../aqr-num" }
memchr = { version = "2", optional = true }
zstd = { version = "0.13", optional = true }

# Tools are named <crate>-<tool> (the crate's own one, src/main.rs, after the crate), so
# that names do not collide in the workspace's target directory.

[[example]]
name = "aqr-xsv-bench"
path = "examples/bench.rs"
required-features = ["encode"]
