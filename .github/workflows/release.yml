name: release

# A tag `v*` pushed builds the binaries and uploads them to the tag's release: a draft made
# for it unless a release is there already (its notes are written by hand), the assets
# replaced if the workflow is run again. Run by hand (workflow_dispatch) or on schedule, it only
# builds them as the run's artifacts.
#
# Dependencies are cached (rust-cache), saved only by runs on main, for the runs not of a tag: a
# tag's run builds from nothing, so that no cache (written by any run on main) goes into a
# release. The scheduled runs, twice a week on main, keep them there (and catch a build broken,
# say by a toolchain, before a tag does). The nightly of the jobs that need one (build-std) is
# pinned by the file nightly-toolchain.
#
# Against a compromised dependency (supply chain): the actions, the transitive ones too, are
# pinned by commit in .github/workflows/actions.lock (`gh actions-lock`; Dependabot keeps it up
# to date, and a workflow using an action not in it does not start); every job's token reads
# only, but the release's; the checkouts keep no credentials; the crates are Cargo.lock's (a job
# fails if the build changed it), the downloads checked by SHA-256. The release carries
# SHA256SUMS and an attestation of build provenance for its assets, which the Homebrew tap
# verifies before taking a release.
#
# Before tagging: add the tag to the revisions of scripts/released-modules.sh and run it, so that
# the modules of the release stay valid for the reserved Apply instruction after they are rebuilt
# (crates/aqr-formula/src/released.rs).
#
# The binaries carry the tag as their version (AQR_VERSION, crates/aqr-version: `aqr --version`,
# Windows' VERSIONINFO, the app's Info.plist); a run not for a tag, `git describe`'s of the
# shallow clone (0.0.0-gHASH).
#
# Assets, STEM being the tag without `v0.0.` (v0.0.20261031 -> 20261031):
#   aqr-STEM.exe                  Windows 10 on, x86_64 (packed by UPX)
#   aqr-STEM-win7.exe             Windows 7 and 8 (cargo +NIGHTLY win7; packed by UPX)
#   aqr-STEM-win-install.exe      the installer, aqr.exe and aqr-win.exe (crates/aqr-win-install)
#   aqr-STEM-mac.zip              Aqueous.app, universal (crates/aqr-mac/bundle.sh --universal)
#   aqr-STEM-linux-x86_64.tar.xz  aqr (glibc of Ubuntu 22.04 on)
#   aqr-STEM-linux-aarch64.tar.xz
#   SHA256SUMS                    the SHA-256s of the above (their provenance attested)
#
# The debug information of each binary is not in the assets but in the run's artifacts named
# debug-* (kept as the repository's retention allows): Windows' PDBs, the dSYMs of the Mac's,
# Linux's aqr.debug (split off by objcopy, the binary pointing to it by .gnu_debuglink). To
# debug a release, take them from the run of its tag (aqr.exe unpacked by `upx -d` first).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # (main's caches kept warm: GitHub drops a cache unused for 7 days)
  schedule:
    - cron: '17 18 * * 0,3'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # UPX for aqr.exe and aqr-win7.exe (github.com/upx/upx's release, checked by its SHA-256)
  UPX_VERSION: 5.0.2
  UPX_SHA256: 1cff6d6ee01c404d4a1ae56003056bd4cfa28d0a5cea1d0950daaf872a4facc9

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          s=${GITHUB_REF_NAME#v0.0.}
          [ "$GITHUB_REF_TYPE" = tag ] || s=$(git rev-parse --short HEAD)
          echo "STEM=${s#v}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "AQR_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; fi
      # (the toolchain of rust-toolchain.toml)
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        # (a tag's run takes no cache)
        if: github.ref_type != 'tag' # zizmor: ignore[cache-poisoning]
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What aqr's build.rs packs into aqr.exe (target/aqr-sfx/, crates/aqr-sfx/pack.sh): the
      # interpreter blob, which runs the modules as WebAssembly (aqr links no Wasmtime on Windows
      # x86-64), and the stub and the modules' blobs of `--format sfx`. Built by the nightly with
      # build-std (the no-TLS target of crates/aqr-dll), and Python for crates/aqr-dll/layout.py.
      # (the nightly of nightly-toolchain, pinned: AQR_NIGHTLY for the scripts)
      - run: |
          echo "AQR_NIGHTLY=$(cat nightly-toolchain)" >> "$GITHUB_ENV"
          rustup toolchain install "$(cat nightly-toolchain)" --profile minimal --component rust-src
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
      - run: PYTHON=python crates/aqr-sfx/pack.sh
      - run: cargo build --profile dist -p aqr -p aqr-win
      # aqr.exe runs modules as WebAssembly (by the interpreter blob it carries) and makes a
      # self-extracting program that gives the files back: a build without the pack fails here.
      - run: |
          mkdir smoke
          cp codecs/aqr-jpeg/tests/data/gradient.jpg README.md smoke/
          target/dist/aqr.exe -c -q -o smoke.aqr smoke
          target/dist/aqr.exe -d -q --wasm -o smoke-wasm smoke.aqr
          diff -r smoke smoke-wasm
          target/dist/aqr.exe -c -q --format sfx -o smoke.exe smoke
          ./smoke.exe smoke-out
          diff -r smoke smoke-out
      # build.rs packs target/dist/{aqr,aqr-win}.exe, built above.
      - run: cargo build --profile dist -p aqr-win-install
      - run: |
          mkdir out
          cp target/dist/aqr.exe "out/aqr-$STEM.exe"
          cp target/dist/aqr-win-install.exe "out/aqr-$STEM-win-install.exe"
      # Last, aqr.exe alone packed by UPX (the installer carries it unpacked, which its own
      # payload compresses better; the installer itself is not packed).
      - run: |
          curl -sSfLo upx.zip "https://github.com/upx/upx/releases/download/v$UPX_VERSION/upx-$UPX_VERSION-win64.zip"
          echo "$UPX_SHA256 *upx.zip" | sha256sum -c -
          unzip -jq upx.zip "upx-$UPX_VERSION-win64/upx.exe"
          ./upx.exe -9 -q "out/aqr-$STEM.exe"
      # (built by Cargo.lock as committed: cargo would have rewritten it otherwise)
      - run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bin-windows
          path: out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: debug-windows
          path: |
            target/dist/aqr.pdb
            target/dist/aqr_win.pdb
            target/dist/aqr_win_install.pdb
          if-no-files-found: error

  win7:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          s=${GITHUB_REF_NAME#v0.0.}
          [ "$GITHUB_REF_TYPE" = tag ] || s=$(git rev-parse --short HEAD)
          echo "STEM=${s#v}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "AQR_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; fi
      # (the nightly of nightly-toolchain, pinned: AQR_NIGHTLY for the scripts)
      - run: |
          echo "AQR_NIGHTLY=$(cat nightly-toolchain)" >> "$GITHUB_ENV"
          rustup toolchain install "$(cat nightly-toolchain)" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2.9.3
        # (a tag's run takes no cache)
        if: github.ref_type != 'tag' # zizmor: ignore[cache-poisoning]
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo "+$AQR_NIGHTLY" win7 -p aqr
      - run: |
          mkdir out
          cp target/x86_64-win7-windows-msvc/dist/aqr.exe "out/aqr-$STEM-win7.exe"
      # (packed by UPX as in the job windows)
      - run: |
          curl -sSfLo upx.zip "https://github.com/upx/upx/releases/download/v$UPX_VERSION/upx-$UPX_VERSION-win64.zip"
          echo "$UPX_SHA256 *upx.zip" | sha256sum -c -
          unzip -jq upx.zip "upx-$UPX_VERSION-win64/upx.exe"
          ./upx.exe -9 -q out/*.exe
      # (built by Cargo.lock as committed: cargo would have rewritten it otherwise)
      - run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bin-win7
          path: out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: debug-win7
          path: target/x86_64-win7-windows-msvc/dist/aqr.pdb
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          s=${GITHUB_REF_NAME#v0.0.}
          [ "$GITHUB_REF_TYPE" = tag ] || s=$(git rev-parse --short HEAD)
          echo "STEM=${s#v}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "AQR_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; fi
      - run: rustup toolchain install && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.3
        # (a tag's run takes no cache)
        if: github.ref_type != 'tag' # zizmor: ignore[cache-poisoning]
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # (split-debuginfo "packed": dsymutil run before profile.dist's strip, leaving a dSYM for
      # each binary of each architecture, a symlink into deps/; by default, "unpacked", the
      # DWARF stays in the objects and the strip takes the binary's map of them)
      - run: crates/aqr-mac/bundle.sh --universal
        env:
          CARGO_PROFILE_DIST_SPLIT_DEBUGINFO: packed
      - run: |
          mkdir out
          cp target/dist/Aqueous.zip "out/aqr-$STEM-mac.zip"
      - run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
              mkdir -p "debug/$t"
              cp -RL "target/$t/dist/aqr.dSYM" "target/$t/dist/aqr-mac.dSYM" "debug/$t/"
          done
      # (built by Cargo.lock as committed: cargo would have rewritten it otherwise)
      - run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bin-mac
          path: out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: debug-mac
          path: debug/
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          s=${GITHUB_REF_NAME#v0.0.}
          [ "$GITHUB_REF_TYPE" = tag ] || s=$(git rev-parse --short HEAD)
          echo "STEM=${s#v}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "AQR_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; fi
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        # (a tag's run takes no cache)
        if: github.ref_type != 'tag' # zizmor: ignore[cache-poisoning]
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.arch }}
      # Built with its debug information (profile.dist strips it), which is split off into
      # aqr.debug for the artifact debug-linux-*: the binary as strip = "debuginfo" leaves it, with
      # a .gnu_debuglink to aqr.debug.
      - run: cargo build --profile dist -p aqr --bin aqr
        env:
          CARGO_PROFILE_DIST_STRIP: none
      - run: |
          cd target/dist
          objcopy --only-keep-debug --compress-debug-sections aqr aqr.debug
          objcopy --strip-debug --add-gnu-debuglink=aqr.debug aqr
      - env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir out
          tar -C target/dist -cJf "out/aqr-$STEM-linux-$ARCH.tar.xz" aqr
      # (built by Cargo.lock as committed: cargo would have rewritten it otherwise)
      - run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bin-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: debug-linux-${{ matrix.arch }}
          path: target/dist/aqr.debug
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, win7, mac, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release made and its assets uploaded
      id-token: write # the attestation signed (Sigstore, by the OIDC token)
      attestations: write # the attestation stored
    steps:
      # (the binaries alone: the debug-* artifacts stay with the run)
      - uses: actions/download-artifact@v8.0.2
        with:
          path: out
          pattern: bin-*
          merge-multiple: true
      # The SHA-256s of the assets, and their build provenance (Sigstore, by GitHub's attestations:
      # `gh attestation verify FILE -R lifthrasiir/aqueous`), tying each to this workflow and the tag.
      - run: (cd out && sha256sum -- *) > SHA256SUMS && mv SHA256SUMS out/ && cat out/SHA256SUMS
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-checksums: out/SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l out
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "Aqueous archiver $TAG" --notes ""
          gh release upload "$TAG" out/* --clobber
