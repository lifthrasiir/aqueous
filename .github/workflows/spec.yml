name: spec

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'site/**'
      - 'droplet.svg'
      - '.github/workflows/spec.yml'
  workflow_dispatch:

# (the build reads only; the deployment alone may write the pages)
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      # (Bikeshed and every dependency of it pinned with their hashes: spec/requirements.in)
      - run: pip install --require-hashes --no-deps -r spec/requirements.txt
      # Figures are committed as SVGs, so pikchr isn't needed here.
      - run: mkdir -p _site/spec && bikeshed spec spec/index.bs _site/spec/index.html
      # The site's root page (site/), with the icon it uses.
      - run: cp -R site/. _site/ && cp droplet.svg _site/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # the pages deployed
      id-token: write # (deploy-pages: the OIDC token proves the deployment)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
