name: spec

on:
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - '.github/workflows/spec.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bikeshed
      # Figures are committed as SVGs, so pikchr isn't needed here.
      - run: mkdir -p _site/spec && bikeshed spec spec/index.bs _site/spec/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}spec/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
