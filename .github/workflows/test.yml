name: test

# The tests (cargo-nextest, .config/nextest.toml's profile ci, at the profile release-test) of the
# packages a change can affect, on Linux and Windows (x86-64), and by schedule and by hand on
# macOS (arm64, where the tests are run as the code is written): scripts/affected-crates.py takes
# the changed files from the merge base (the commit before the push, or the pull request's base)
# and adds the packages depending on theirs. The scheduled runs, by hand and of a push of no base
# known (a new branch, a force push) test the whole workspace (but aqr-dll's dylibs, whose tests
# do not build). Doctests are not run (5 in the workspace; building them took longer than the
# tests of most packages).
#
# Measured on an M4 (10 cores), 2026-11-20: building every test from nothing 270 s (2170 CPU
# seconds), the tests 216 s through nextest (700 s through cargo test, one binary at a time). The
# median commit of 150 affected 19 packages and 57% of the tests' CPU time: aqr-decompress (40% by
# itself) depends on nearly every codec. A runner has 4 cores; in a Linux VM of 4 (aarch64, 8 GiB),
# the whole workspace took 5 min 20 s to build and 392 s to test, its target 4.5 GB; on Windows
# (16 cores) 226 s to build and 772 s through cargo test, its target 7.3 GB. On ubuntu-latest
# (2026-11-20, nothing cached) 12 min 42 s to build and 1102 s to test: 32 min in all.
#
# The external dependencies are cached (rust-cache), saved only by the runs on main of the whole
# workspace (a run of fewer packages would save what it built alone, under the key of
# Cargo.lock, for every run after it); the workspace's crates are built every time (Cargo tells
# them fresh by their files' times, which a checkout resets).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # (all the tests, and main's cache saved again)
  schedule:
    - cron: '41 19 * * 2,6'

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # (a push to main is never cancelled: the run of the next push tests what it changed alone)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # (no build is kept from one run to the next but the dependencies')
  CARGO_INCREMENTAL: '0'
  # No debug information: on Linux each test binary carries its own, and that of the C libraries
  # (built with -g) and std, 85-90% of its bytes (aqr's tests, 253 MB); the 368 binaries of the
  # workspace filled 18 GB before they were all built, more than a runner has free. The symbols
  # are kept, for the backtraces.
  CARGO_PROFILE_RELEASE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_TEST_STRIP: debuginfo
  # cargo-nextest (github.com/nextest-rs/nextest's release, checked by its SHA-256: the matrix's)
  NEXTEST_VERSION: 0.9.152

jobs:
  # The packages to test, as the arguments of cargo (one a line; none: nothing to test), and the
  # systems to test them on.
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      args: ${{ steps.select.outputs.args }}
      whole: ${{ steps.select.outputs.whole }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # (the base of the changes)
          fetch-depth: 0
      # (cargo metadata, for the packages' dependencies)
      - run: rustup toolchain install --profile minimal
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            push) base=$BEFORE ;;
            pull_request) base=$PR_BASE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            python3 scripts/affected-crates.py "$base" HEAD > selection
          else
            printf '%s\n' --workspace '--exclude=aqr-dll*' > selection
          fi
          cat selection
          { echo 'args<<EOF'; cat selection; echo EOF; } >> "$GITHUB_OUTPUT"
          if grep -qx -- --workspace selection; then echo "whole=1" >> "$GITHUB_OUTPUT"; fi
          # The systems, each with its runner and its cargo-nextest (and the SHA-256 of that):
          # macOS only by schedule and by hand, as the tests are run there as the code is written.
          # (Written whole here: a matrix's `include` adds a job of each entry matching no value.)
          linux='{"os":"linux","runner":"ubuntu-latest","nextest":"x86_64-unknown-linux-gnu","sha256":"d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a"}'
          windows='{"os":"windows","runner":"windows-latest","nextest":"x86_64-pc-windows-msvc","sha256":"0384fc89a5a547d4fd5e183fcc101d31dba2837feafd8e64d5ea003a0ddb1941"}'
          macos='{"os":"macos","runner":"macos-latest","nextest":"universal-apple-darwin","sha256":"2fadf57df4243e691f088ee3bff4f4ab9af16da0c95a1db84b5cb1685e098a76"}'
          case "$EVENT" in
            schedule | workflow_dispatch) echo "matrix=[$linux,$windows,$macos]" ;;
            *) echo "matrix=[$linux,$windows]" ;;
          esac >> "$GITHUB_OUTPUT"

  test:
    needs: select
    if: needs.select.outputs.args != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' && needs.select.outputs.whole == '1' }}
      # The programs the tests run that a runner lacks: sqlite3 makes the databases of aqr-sqlite's,
      # aqr-clip's and aqr-minecraft's tests, ffmpeg the DivX 3 frames of aqr-decompress's (macOS
      # has sqlite3).
      - if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sqlite3 ffmpeg
      - if: matrix.os == 'windows'
        run: choco install -y --no-progress sqlite ffmpeg
      - if: matrix.os == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install --quiet ffmpeg
      - env:
          TARGET: ${{ matrix.nextest }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          f=cargo-nextest-$NEXTEST_VERSION-$TARGET.tar.gz
          curl -sSfLo "$f" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/$f"
          # (sha256sum on Linux and in Git Bash, shasum on macOS)
          if command -v sha256sum > /dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          echo "$SHA256 *$f" | "${sum[@]}" -c -
          # (a directory of its own on the PATH: macOS's rustup has no ~/.cargo/bin)
          # (extracted where it is: GNU tar may take `D:\...` for a host's path)
          mkdir -p "$RUNNER_TEMP/nextest"
          mv "$f" "$RUNNER_TEMP/nextest/"
          (cd "$RUNNER_TEMP/nextest" && tar -xzf "$f" && rm "$f")
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - env:
          ARGS: ${{ needs.select.outputs.args }}
        run: |
          # (no mapfile: macOS's bash is 3.2)
          args=()
          while IFS= read -r a; do args+=("$a"); done <<< "$ARGS"
          cargo nextest run --profile ci --cargo-profile release-test --locked "${args[@]}"
