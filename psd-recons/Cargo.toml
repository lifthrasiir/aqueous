[package]
name = "psd-recons"
version = "0.1.0"
edition = "2024"
description = "Lossless PSD/PSB recompression: bit-exact reconstruction from a smaller representation"
publish = false

[dependencies]
recons-common = { path = "../recons-common" }
flate-recons = { path = "../flate-recons" }
png-recons = { path = "../png-recons" }
jpeg-recons = { path = "../jpeg-recons" }
rayon = "1.12.0"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1
